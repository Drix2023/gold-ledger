<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>黄金账本 · 持仓均价与实时金价</title>
<meta name="theme-color" content="#FFF7F0">
<meta name="description" content="记录每笔黄金买卖，自动算持仓均价、浮动盈亏，实时金价一目了然。">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="黄金账本">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* 底色 / 文字 */
  --bg:#FFF7F0;
  --card:#FFFFFF;
  --ink:#241236;
  --ink2:#6D5C82;
  --ink3:#A292B5;
  --line:#F2E7F3;

  /* 多巴胺色板 */
  --pink:#FF3D8B;
  --orange:#FF7A18;
  --yellow:#FFC300;
  --mint:#00C9A7;
  --sky:#35A8FF;
  --violet:#8B5CF6;
  --lime:#9BD400;

  --gain:#FF3D8B;   /* 涨 / 盈 → 玫红 */
  --loss:#00B894;   /* 跌 / 亏 → 薄荷绿 */

  --r:24px;--r2:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --shadow:0 14px 30px -16px rgba(96,36,120,.28);
}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(620px 320px at 6% -8%,rgba(255,61,139,.18),transparent 62%),
    radial-gradient(560px 300px at 98% 0%,rgba(255,195,0,.26),transparent 58%),
    radial-gradient(760px 380px at 50% 108%,rgba(53,168,255,.16),transparent 64%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh;
  padding:0 14px calc(108px + var(--safe-b));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 14px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.01em;font-size:17px;color:var(--ink)}
.logo{
  width:34px;height:34px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--pink),var(--orange) 65%,var(--yellow));
  color:#fff;font:800 13px/1 Georgia,serif;letter-spacing:0;
  box-shadow:0 8px 18px -8px rgba(255,61,139,.85);
}
.actions{display:flex;gap:9px}
.icon-btn{
  width:38px;height:38px;border-radius:14px;display:grid;place-items:center;
  background:#fff;border:1px solid var(--line);color:var(--ink2);
  font-size:15px;transition:.15s;box-shadow:0 6px 14px -10px rgba(96,36,120,.6);
}
.icon-btn:active{transform:scale(.94)}
.icon-btn.on{color:var(--pink);border-color:#FFD3E4;background:#FFF2F7}

/* ---------- 卡片 ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);
}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 10px;font-size:12.5px;color:var(--ink3);letter-spacing:.03em}
.sec-title b{font-weight:800;color:var(--ink);font-size:15px;letter-spacing:0}
.sec-title span{font-weight:600}

/* ---------- 金价卡（渐变主角） ---------- */
.price-card{
  padding:18px 18px 16px;position:relative;overflow:hidden;border:0;
  background:
    linear-gradient(180deg,rgba(90,10,50,0) 42%,rgba(90,10,50,.26) 100%),
    linear-gradient(135deg,#FF3D8B 0%,#FF6A3D 54%,#FFB300 100%);
  box-shadow:0 20px 44px -20px rgba(255,61,139,.75);
  color:#fff;
}
.price-card::after{
  content:"";position:absolute;right:-50px;top:-70px;width:190px;height:190px;
  background:radial-gradient(circle,rgba(255,255,255,.42),transparent 66%);
  pointer-events:none;
}
.pc-top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:rgba(255,255,255,.9);position:relative;z-index:1}
.dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.28)}
.dot.err{background:#FFE066;box-shadow:0 0 0 3px rgba(255,224,102,.3)}
.dot.busy{background:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.28}}
.pc-price{display:flex;align-items:baseline;gap:7px;margin:8px 0 3px;position:relative;z-index:1}
.pc-price .v{
  font-size:44px;font-weight:850;letter-spacing:-.03em;color:#fff;
  font-variant-numeric:tabular-nums;line-height:1.05;
  text-shadow:0 4px 18px rgba(150,20,70,.28);
}
.pc-price .u{font-size:14px;color:rgba(255,255,255,.86);font-weight:600}
.pc-sub{font-size:12.5px;color:rgba(255,255,255,.94);display:flex;flex-wrap:wrap;gap:4px 12px;position:relative;z-index:1;text-shadow:0 1px 6px rgba(120,20,60,.35)}
.pc-sub .k{color:rgba(255,255,255,.78)}
.pc-refresh{
  font-size:12px;font-weight:800;padding:5px 13px;border-radius:10px;
  background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.5);color:#fff;
  transition:.15s;flex:0 0 auto;
}
.pc-refresh:active{transform:scale(.95);background:rgba(255,255,255,.36)}

/* ---------- 统计格 ---------- */
.stats{margin-top:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{
  padding:14px 15px;border-radius:var(--r2);background:#fff;border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.stat .k{font-size:12.5px;color:var(--ink2);font-weight:700;display:flex;align-items:center;gap:5px}
.stat .v{font-size:21px;font-weight:820;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink);line-height:1.2}
.stat .s{font-size:11.5px;color:var(--ink3);margin-top:3px;font-weight:500}

.stat.hero{
  grid-column:1/-1;
  background:linear-gradient(120deg,#FFF0F6 0%,#FFF4E6 60%,#FFFBE6 100%);
  border-color:#FFE1EC;
}
.stat.hero .k{color:#C2185B}
.stat.hero .v{font-size:36px;color:var(--pink);text-shadow:0 6px 18px rgba(255,61,139,.18)}

.stat.t-mint{background:#E7FBF5;border-color:#C6F3E6}
.stat.t-mint .k{color:#0E8E75}
.stat.t-mint .v{color:#00A98C}

.stat.t-sky{background:#E9F4FF;border-color:#CDE8FF}
.stat.t-sky .k{color:#2470B8}
.stat.t-sky .v{color:#1C7FD6}

.stat.t-yellow{background:#FFF8DB;border-color:#FFEDAF}
.stat.t-yellow .k{color:#A87C00}
.stat.t-yellow .v{color:#C08A00}

.stat.t-violet{background:#F4EDFF;border-color:#E4D7FF}
.stat.t-violet .k{color:#6D3FC4}
.stat.t-violet .v{color:#7C3AED}

.stat.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.stat.wide .v{margin-top:0}

.up{color:var(--gain)!important}
.dn{color:var(--loss)!important}
.flat{color:var(--ink2)!important}

/* ---------- 图表 ---------- */
.chart-card{padding:12px 10px 8px}
#chart{display:block;width:100%}
#chart .empty{padding:46px 18px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.9}
#chart .empty b{font-weight:800}
#chart .empty .mini{color:var(--pink);font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:6px 10px 2px;font-size:11.5px;color:var(--ink2);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:4px;border-radius:3px;display:inline-block;flex:0 0 auto}
.legend b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);padding:6px 10px 2px;font-weight:600}

/* ---------- 记录 ---------- */
.rec{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .tag{flex:0 0 auto;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:12px;font-weight:800}
.rec.buy .tag{background:#FFE3EF;color:#E81E70}
.rec.sell .tag{background:#DDF8F1;color:#009B80}
.rec .main{flex:1;min-width:0}
.rec .l1{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums;font-weight:650}
.rec .l1>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .l1 .amt{font-weight:800;white-space:nowrap;flex:0 0 auto}
.rec.buy .l1 .amt{color:#E81E70}
.rec.sell .l1 .amt{color:#009B80}
.rec .l2{font-size:12px;color:var(--ink3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;font-weight:500}
.rec .ops{display:flex;gap:2px;flex:0 0 auto}
.rec .ops button{padding:7px 8px;border-radius:10px;color:var(--ink3);font-size:13px}
.rec .ops button:active{background:#F8F1FA}
.empty-box{padding:38px 16px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.95;font-weight:500}

/* ---------- 悬浮按钮 ---------- */
.fab{
  position:fixed;right:calc(50% - 360px + 18px);bottom:calc(24px + var(--safe-b));
  width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,#FF3D8B,#FF7A18 60%,#FFB300);
  color:#fff;font-size:30px;font-weight:300;line-height:1;padding-bottom:3px;
  box-shadow:0 16px 32px -10px rgba(255,61,139,.9),0 4px 12px rgba(255,122,24,.35);
  transition:.15s;z-index:20;
}
@media(max-width:760px){.fab{right:18px;bottom:calc(22px + var(--safe-b))}}
.fab:active{transform:scale(.92)}
.fab::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,61,139,.22);animation:ring 2.6s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:scale(.9);opacity:.9}70%{transform:scale(1.22);opacity:0}100%{opacity:0}}

/* ---------- 弹窗 ---------- */
.modal{
  position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(36,18,54,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  animation:fade .16s ease;
}
.modal[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.sheet{
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--card);border-radius:28px 28px 0 0;padding:0 0 calc(18px + var(--safe-b));
  animation:slide .24s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -12px 40px -10px rgba(96,36,120,.35);
}
@keyframes slide{from{transform:translateY(30px);opacity:.5}}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:26px;max-height:86vh;padding-bottom:18px}}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 18px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:17px;font-weight:850;color:var(--ink)}
.sheet-body{padding:18px 18px 0}
.field{display:block;margin-bottom:13px}
.field>span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:7px;font-weight:700}
.field input,.field select{
  width:100%;padding:13px 14px;border-radius:14px;background:#FAF5FD;
  border:1.5px solid #F0E6F8;outline:none;font-size:16px;color:var(--ink);
  transition:border-color .15s,background .15s;
}
.field input:focus,.field select:focus{border-color:#FFB3D1;background:#FFF9FC}
.field input::placeholder{color:#C4B6D2}
.field .hint{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.6;font-weight:500}
.field .hint b{color:var(--ink2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#F8F2FC;padding:5px;border-radius:16px;margin-bottom:16px}
.seg-btn{padding:11px;border-radius:12px;font-size:14px;color:var(--ink3);transition:.15s;font-weight:750}
.seg-btn.active{background:#fff;color:var(--ink);box-shadow:0 4px 12px -6px rgba(96,36,120,.5)}
.seg-btn[data-side=buy].active{background:#FFE3EF;color:#E81E70}
.seg-btn[data-side=sell].active{background:#DDF8F1;color:#009B80}
.sheet-foot{display:flex;gap:11px;padding:16px 18px 0;position:sticky;bottom:0;background:linear-gradient(180deg,transparent,#fff 22%)}
.btn{
  flex:1;padding:14px;border-radius:15px;font-size:15px;font-weight:800;text-align:center;
  background:#F8F2FC;border:1.5px solid #F0E6F8;color:var(--ink);transition:.15s;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(135deg,#FF3D8B,#FF7A18);color:#fff;border-color:transparent;box-shadow:0 12px 24px -12px rgba(255,61,139,.85)}
.btn.danger{color:#E11D48;background:#FFF1F4;border-color:#FFD6E0}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.sm{flex:0 0 auto;padding:10px 14px;font-size:13px;border-radius:12px}
.group{margin:22px 0 10px;font-size:12px;color:var(--ink3);letter-spacing:.06em;font-weight:800;text-transform:uppercase}
.divider{height:1px;background:var(--line);margin:16px 0}

/* ---------- toast / badge ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,10px);
  background:#241236;border:1px solid #3A2452;color:#fff;
  padding:12px 20px;border-radius:15px;font-size:13.5px;font-weight:600;z-index:99;
  opacity:0;pointer-events:none;transition:.22s;max-width:86vw;text-align:center;
  box-shadow:0 18px 40px -14px rgba(36,18,54,.7);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.badge{font-size:11px;padding:2px 8px;border-radius:8px;background:#F5EEFA;color:var(--ink2);border:1px solid var(--line);font-weight:700}
.badge:empty{display:none}
.badge.warn{background:#FFF0F3;color:#E11D48;border-color:#FFD6E0}
.disclaimer{text-align:center;color:var(--ink3);font-size:11.5px;margin:24px 0 0;line-height:1.75;font-weight:500}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand"><span class="logo">Au</span>黄金账本</div>
    <div class="actions">
      <button class="icon-btn" id="btnSync" title="云同步">☁</button>
      <button class="icon-btn" id="btnSettings" title="设置">⚙</button>
    </div>
  </div>

  <!-- 实时金价 -->
  <section class="card price-card">
    <div class="pc-top">
      <span class="dot" id="priceDot"></span>
      <span id="priceState">—</span>
      <span style="flex:1"></span>
      <button class="pc-refresh" id="btnRefresh">刷新</button>
    </div>
    <div class="pc-price">
      <span class="v" id="price">—</span>
      <span class="u">元 / 克</span>
    </div>
    <div class="pc-sub">
      <span><span class="k">来源</span> <span id="priceSrc">—</span></span>
      <span><span class="k">更新</span> <span id="priceTime">—</span></span>
      <span id="priceRef"></span>
    </div>
  </section>

  <!-- 统计 -->
  <section class="stats" id="stats">
    <div class="stat hero">
      <div class="k">持仓均价 <span class="badge" id="avgHint"></span></div>
      <div class="v" id="sAvg">—</div>
      <div class="s" id="sAvgSub">—</div>
    </div>
    <div class="stat t-mint">
      <div class="k">持有克重</div>
      <div class="v" id="sGrams">—</div>
      <div class="s" id="sGramsSub">—</div>
    </div>
    <div class="stat t-sky">
      <div class="k">持仓成本</div>
      <div class="v" id="sCost">—</div>
      <div class="s" id="sCostSub">—</div>
    </div>
    <div class="stat t-yellow">
      <div class="k">当前市值</div>
      <div class="v" id="sValue">—</div>
      <div class="s" id="sValueSub">—</div>
    </div>
    <div class="stat">
      <div class="k">浮动盈亏</div>
      <div class="v" id="sUnreal">—</div>
      <div class="s" id="sUnrealSub">—</div>
    </div>
    <div class="stat wide t-violet">
      <div class="k">已实现盈亏</div>
      <div class="v" id="sReal">—</div>
      <div class="s" id="sRealSub">—</div>
    </div>
  </section>

  <!-- 走势 -->
  <div class="sec-title"><b>金价走势</b><span id="chartHint">本地采样</span></div>
  <section class="card chart-card"><div id="chart"></div></section>

  <!-- 记录 -->
  <div class="sec-title"><b>交易记录</b><span id="recCount">0 笔</span></div>
  <section class="card" id="recBox">
    <div class="empty-box" id="recEmpty">
      还没有记录<br>
      点右下角 <b style="color:#FF3D8B">+</b> 记下第一笔买入
    </div>
    <div id="recList"></div>
  </section>

  <p class="disclaimer">数据保存在本机浏览器 · 金价仅供参考，不构成投资建议</p>
</div>

<button class="fab" id="fab" aria-label="添加记录">+</button>

<!-- 记录弹窗 -->
<div class="modal" id="modalRec" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="recTitle">添加记录</h2>
      <button class="icon-btn" data-close="modalRec" style="width:30px;height:30px">✕</button>
    </div>
    <form id="formRec" autocomplete="off">
      <div class="sheet-body">
        <input type="hidden" id="rId">
        <div class="seg">
          <button type="button" class="seg-btn active" data-side="buy">买入</button>
          <button type="button" class="seg-btn" data-side="sell">卖出</button>
        </div>
        <label class="field"><span>日期</span><input id="rDate" type="date"></label>
        <div class="row2">
          <label class="field"><span>克重（g）</span><input id="rGrams" inputmode="decimal" placeholder="0.000"></label>
          <label class="field"><span>单价（元/克）</span><input id="rPrice" inputmode="decimal" placeholder="0.00"></label>
        </div>
        <label class="field"><span>总金额（元）</span>
          <input id="rAmount" inputmode="decimal" placeholder="0.00">
          <div class="hint">克重 / 单价 / 总金额，填任意两个，第三个自动算</div>
        </label>
        <label class="field"><span>手续费（元，可选）</span><input id="rFee" inputmode="decimal" placeholder="0"></label>
        <label class="field"><span>备注（可选）</span><input id="rNote" maxlength="60" placeholder="如：建行金条 / 工行积存金 / 周大福"></label>
      </div>
      <div class="sheet-foot">
        <button type="button" class="btn ghost" data-close="modalRec">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal" id="modalSet" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2>设置</h2>
      <button class="icon-btn" data-close="modalSet" style="width:30px;height:30px">✕</button>
    </div>
    <div class="sheet-body">

      <div class="group">金价来源</div>
      <label class="field"><span>数据源</span>
        <select id="sSource">
          <option value="auto">自动 · 国际金价折算人民币</option>
          <option value="proxy">自动 · 自定义代理（国内金价推荐）</option>
          <option value="manual">手动填写金价</option>
        </select>
        <div class="hint" id="srcHint"></div>
      </label>
      <div id="boxManual" hidden>
        <label class="field"><span>当前金价（元/克）</span><input id="sManual" inputmode="decimal" placeholder="如 880"></label>
      </div>
      <div id="boxProxy" hidden>
        <label class="field"><span>代理接口地址</span><input id="sProxy" placeholder="https://xxx.workers.dev/" inputmode="url">
          <div class="hint">用仓库里的 <b>worker/gold-price-proxy.js</b> 免费部署一个 Cloudflare Worker，把地址填这里。</div>
        </label>
      </div>
      <div id="boxAuto">
        <div class="row2">
          <label class="field"><span>折算加价（元/克）</span><input id="sPremium" inputmode="decimal" placeholder="0">
            <div class="hint">国内实售价常高于国际折算价</div>
          </label>
          <label class="field"><span>美元兑人民币</span><input id="sUsdCny" inputmode="decimal" placeholder="自动">
            <div class="hint">留空则自动获取汇率</div>
          </label>
        </div>
      </div>

      <div class="divider"></div>
      <div class="group">云同步（多设备共用一份数据）</div>
      <label class="field"><span>GitHub Token（只需 gist 权限）</span>
        <input id="sToken" type="password" placeholder="github_pat_..." autocomplete="off">
        <div class="hint">在 GitHub → Settings → Developer settings → Personal access tokens 生成，仅勾选 <b>gist</b>。Token 只存在本机浏览器里。</div>
      </label>
      <label class="field"><span>Gist ID</span>
        <input id="sGist" placeholder="留空则点下面「创建」自动生成" autocomplete="off">
      </label>
      <div class="row2" style="margin-bottom:12px">
        <button type="button" class="btn sm" id="btnGistCreate" style="flex:1">新建云存档</button>
        <button type="button" class="btn sm" id="btnGistSync" style="flex:1">立即同步</button>
      </div>
      <label class="field" style="display:flex;align-items:center;gap:9px;margin-bottom:4px">
        <input type="checkbox" id="sAutoSync" style="width:20px;height:20px;padding:0;flex:0 0 auto;accent-color:#FF3D8B">
        <span style="margin:0;font-size:14px;color:var(--txt)">改动后自动同步</span>
      </label>

      <div class="divider"></div>
      <div class="group">数据</div>
      <div class="row2" style="margin-bottom:10px">
        <button type="button" class="btn sm" id="btnExport" style="flex:1">导出备份</button>
        <button type="button" class="btn sm" id="btnImport" style="flex:1">导入备份</button>
      </div>
      <div class="row2" style="margin-bottom:10px">
        <button type="button" class="btn sm" id="btnCsv" style="flex:1">导出 CSV</button>
        <button type="button" class="btn sm danger" id="btnClear" style="flex:1">清空数据</button>
      </div>
      <input type="file" id="fileImport" accept=".json,application/json" hidden>

      <div class="sheet-foot" style="padding-left:0;padding-right:0">
        <button type="button" class="btn ghost" data-close="modalSet">关闭</button>
        <button type="button" class="btn primary" id="btnSaveSet">保存设置</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   黄金账本 — 单文件离线应用
   数据：localStorage（可选 GitHub Gist 云同步）
   ========================================================= */
(function () {
  'use strict';

  /* ---------------- 常量 ---------------- */
  var K = {
    rec:  'gl.records.v1',
    set:  'gl.settings.v1',
    hist: 'gl.history.v1',
    meta: 'gl.meta.v1',
    sync: 'gl.sync.v1',
    spot: 'gl.spot.v1'
  };
  var OZ = 31.1034768;          // 1 金衡盎司 = 31.1034768 克
  var GIST_FILE = 'gold-ledger.json';
  var SAMPLE_GAP = 10 * 60 * 1000;   // 金价采样最小间隔

  var DEFAULT_SET = {
    source: 'auto',
    manual: 0,
    proxy: '',
    premium: 0,
    usdCny: 0
  };

  /* ---------------- 小工具 ---------------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    var n = parseFloat(String(v == null ? '' : v).replace(/[,\s¥￥%]/g, ''));
    return isFinite(n) ? n : 0;
  }
  function fmt(n, d) {
    n = isFinite(n) ? n : 0;
    return n.toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function money(n) { return '¥' + fmt(n, 2); }
  function gfmt(n) {
    var s = fmt(n, 3);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }
  function signed(n, d) {
    var s = fmt(Math.abs(n), d == null ? 2 : d);
    if (n > 0.0000001) return '+' + s;
    if (n < -0.0000001) return '-' + s;
    return s;
  }
  function pct(n) {
    if (!isFinite(n)) return '';
    return (n > 0 ? '+' : '') + fmt(n * 100, 2) + '%';
  }
  function todayStr() {
    var d = new Date(), p = function (x) { return x < 10 ? '0' + x : '' + x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function readLS(k, fb) {
    try { var s = localStorage.getItem(k); return s == null ? fb : JSON.parse(s); }
    catch (e) { return fb; }
  }
  function writeLS(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { toast('本地存储失败：' + e.message); return false; }
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }
  function timeAgo(ts) {
    if (!ts) return '—';
    var s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (s < 45) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    if (s < 86400 * 30) return Math.floor(s / 86400) + ' 天前';
    var d = new Date(ts), p = function (x) { return x < 10 ? '0' + x : '' + x; };
    return (d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function fetchJSON(url, opts, ms) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, ms || 12000);
    return fetch(url, Object.assign({ signal: ctl.signal, cache: 'no-store' }, opts || {}))
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) { clearTimeout(timer); return d; },
            function (e) { clearTimeout(timer); throw e; });
  }

  /* ---------------- 状态 ---------------- */
  var state = {
    records: readLS(K.rec, []) || [],
    settings: Object.assign({}, DEFAULT_SET, readLS(K.set, {}) || {}),
    hist: readLS(K.hist, []) || [],
    sync: Object.assign({ token: '', gistId: '', auto: true }, readLS(K.sync, {}) || {}),
    meta: Object.assign({ updatedAt: 0 }, readLS(K.meta, {}) || {}),
    spot: readLS(K.spot, null),
    busy: false,
    err: ''
  };
  if (!Array.isArray(state.records)) state.records = [];
  if (!Array.isArray(state.hist)) state.hist = [];
  var stats = null;

  /* ---------------- 计算 ---------------- */
  function computeStats() {
    var rs = state.records.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
    var g = 0, cost = 0, realized = 0;
    var buyG = 0, buyAmt = 0, sellG = 0, sellAmt = 0, overSold = false;

    rs.forEach(function (r) {
      var gg = num(r.grams), p = num(r.price), fee = num(r.fee);
      if (gg <= 0) return;
      if (r.side === 'buy') {
        g += gg;
        cost += gg * p + fee;
        buyG += gg;
        buyAmt += gg * p + fee;
      } else {
        if (gg > g + 1e-9) overSold = true;
        var sold = Math.min(gg, g);
        var avg = g > 0 ? cost / g : 0;
        realized += sold * p - (gg > 0 ? fee * (sold / gg) : 0) - sold * avg;
        cost -= sold * avg;
        g -= sold;
        sellG += gg;
        sellAmt += gg * p - fee;
      }
      if (g < 1e-9) { g = 0; cost = 0; }
    });

    var spot = state.spot && state.spot.cny > 0 ? state.spot.cny : 0;
    var avgCost = g > 0 ? cost / g : 0;
    var value = spot > 0 ? g * spot : 0;
    var unreal = spot > 0 ? value - cost : 0;
    var unrealPct = cost > 0 ? unreal / cost : 0;

    stats = {
      grams: g, cost: cost, avgCost: avgCost, realized: realized,
      spot: spot, value: value, unreal: unreal, unrealPct: unrealPct,
      total: unreal + realized,
      buyG: buyG, buyAmt: buyAmt, buyAvg: buyG > 0 ? buyAmt / buyG : 0,
      sellG: sellG, sellAmt: sellAmt,
      overSold: overSold, count: state.records.length
    };
    return stats;
  }

  /* ---------------- 渲染：金价 ---------------- */
  function renderPrice() {
    var s = state.spot;
    var dot = $('#priceDot'), st = $('#priceState');
    dot.className = 'dot';
    if (state.busy) { dot.classList.add('busy'); st.textContent = '获取中…'; }
    else if (state.err) { dot.classList.add('err'); st.textContent = '获取失败 · ' + state.err; }
    else if (s) { st.textContent = state.settings.source === 'manual' ? '手动金价' : '实时'; }
    else { st.textContent = '暂无价格'; }

    $('#price').textContent = s && s.cny > 0 ? fmt(s.cny, 2) : '—';
    $('#priceSrc').textContent = (s && s.src) || '—';
    $('#priceTime').textContent = s ? timeAgo(s.ts) : '—';

    var ref = [];
    if (s && s.usdPerOz > 0) ref.push('$' + fmt(s.usdPerOz, 1) + '/oz');
    if (s && s.usdCny > 0) ref.push('汇率 ' + fmt(s.usdCny, 3));
    $('#priceRef').innerHTML = ref.length ? '<span class="k">' + ref.join(' · ') + '</span>' : '';

    $('#btnSync').classList.toggle('on', !!(state.sync.token && state.sync.gistId));
  }

  /* ---------------- 渲染：统计 ---------------- */
  function renderStats() {
    var s = stats;
    var hasSpot = s.spot > 0;

    $('#sAvg').textContent = s.grams > 0 ? money(s.avgCost) : '—';
    var diff = hasSpot && s.avgCost > 0 ? (s.spot - s.avgCost) / s.avgCost : 0;
    if (s.grams > 0 && hasSpot && s.avgCost > 0) {
      var above = s.spot >= s.avgCost;
      $('#sAvgSub').innerHTML =
        '<span class="' + (above ? 'up' : 'dn') + '">现价 ' + (above ? '高' : '低') + '于均价 ' +
        fmt(Math.abs(diff) * 100, 2) + '%</span>';
      $('#avgHint').textContent = above ? '浮盈' : '浮亏';
      $('#avgHint').className = 'badge' + (above ? '' : ' warn');
    } else {
      $('#sAvgSub').textContent = s.grams > 0 ? '等待金价' : '还没有持仓';
      $('#avgHint').textContent = '';
      $('#avgHint').className = 'badge';
    }

    $('#sGrams').textContent = gfmt(s.grams) + ' g';
    $('#sGramsSub').textContent = s.buyG > 0 ? '累计买入 ' + gfmt(s.buyG) + ' g' : '—';

    $('#sCost').textContent = money(s.cost);
    $('#sCostSub').textContent = '累计投入 ' + money(s.buyAmt);

    $('#sValue').textContent = hasSpot ? money(s.value) : '—';
    $('#sValueSub').textContent = hasSpot ? '@ ' + money(s.spot) + '/g' : '需要金价';

    var u = $('#sUnreal');
    u.textContent = hasSpot && s.grams > 0 ? signed(s.unreal) : '—';
    u.className = 'v ' + (s.unreal > 0.005 ? 'up' : s.unreal < -0.005 ? 'dn' : 'flat');
    $('#sUnrealSub').innerHTML = hasSpot && s.grams > 0
      ? '<span class="' + (s.unreal > 0.005 ? 'up' : s.unreal < -0.005 ? 'dn' : 'flat') + '">' + pct(s.unrealPct) + '</span>'
      : (s.grams > 0 ? '需要金价' : '—');

    var r = $('#sReal');
    r.textContent = s.sellG > 0 ? signed(s.realized) : '—';
    r.className = 'v ' + (s.realized > 0.005 ? 'up' : s.realized < -0.005 ? 'dn' : 'flat');
    $('#sRealSub').textContent = s.sellG > 0 ? '累计卖出 ' + gfmt(s.sellG) + ' g' : '还没有卖出';

    if (s.overSold) {
      $('#sRealSub').innerHTML += ' <span class="badge warn">卖出多于持有</span>';
    }
  }

  /* ---------------- 渲染：走势图 ---------------- */
  function downsample(arr, max) {
    if (arr.length <= max) return arr;
    var out = [], step = arr.length / max;
    for (var i = 0; i < max; i++) out.push(arr[Math.floor(i * step)]);
    out.push(arr[arr.length - 1]);
    return out;
  }

  /* 把 'YYYY-MM-DD' 换成当天中午的时间戳，避开时区边界 */
  function recTimestamp(dateStr) {
    var t = new Date((dateStr || '') + 'T12:00:00').getTime();
    return isFinite(t) ? t : Date.now();
  }

  /* 每笔交易之后的持仓均价，清仓处断开成多段 */
  function buildAvgSegments() {
    var rs = state.records.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
    var g = 0, cost = 0, segs = [], cur = [];
    rs.forEach(function (r) {
      var gg = num(r.grams), p = num(r.price), fee = num(r.fee);
      if (gg <= 0) return;
      if (r.side === 'buy') { g += gg; cost += gg * p + fee; }
      else {
        var sold = Math.min(gg, g);
        var avg = g > 0 ? cost / g : 0;
        cost -= sold * avg; g -= sold;
      }
      if (g < 1e-9) { g = 0; cost = 0; }
      var t = recTimestamp(r.date);
      if (g > 0) {
        var v = cost / g;
        if (cur.length && Math.abs(cur[cur.length - 1].t - t) < 1000) cur[cur.length - 1].v = v;
        else cur.push({ t: t, v: v });
      } else if (cur.length) { segs.push(cur); cur = []; }
    });
    if (cur.length) segs.push(cur);
    return segs;
  }

  function renderChart() {
    var el = $('#chart');
    var price = downsample(state.hist.filter(function (p) { return p && p.c > 0 && p.t > 0; }), 380);
    var segs = buildAvgSegments();
    var avgPts = [];
    segs.forEach(function (s) { s.forEach(function (p) { avgPts.push(p); }); });

    $('#chartHint').textContent = '金价 ' + price.length + ' 点 · 均价 ' + avgPts.length + ' 笔';

    if (price.length < 2 && avgPts.length < 2) {
      el.innerHTML = '<div class="empty">多刷新几次，这里会画出金价曲线<br>' +
        '记录买入后，还会叠加一条<b style="color:#8B5CF6"> 持仓均价曲线</b></div>';
      return;
    }

    /* ---- 统一时间轴：金价采样 + 交易日期 ---- */
    var ts = [];
    price.forEach(function (p) { ts.push(p.t); });
    avgPts.forEach(function (p) { ts.push(p.t); });
    var t0 = Math.min.apply(null, ts), t1 = Math.max.apply(null, ts);
    if (t1 - t0 < 3600e3) { t0 -= 1800e3; t1 += 1800e3; }

    var vals = [];
    price.forEach(function (p) { vals.push(p.c); });
    avgPts.forEach(function (p) { vals.push(p.v); });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var realLo = lo, realHi = hi;
    var span = hi - lo;
    if (span < 0.5) span = Math.max(hi * 0.01, 1);
    lo -= span * 0.13; hi += span * 0.13;

    var W = 680, H = 210, PL = 10, PR = 10, PT = 14, PB = 10;
    var iw = W - PL - PR, ih = H - PT - PB;
    function X(t) { return PL + iw * (t - t0) / (t1 - t0); }
    function Y(v) { return PT + ih - ih * (v - lo) / (hi - lo); }

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">';
    svg += '<defs>' +
      '<linearGradient id="gFill" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#FF3D8B" stop-opacity=".22"/>' +
        '<stop offset="100%" stop-color="#FF7A18" stop-opacity="0"/>' +
      '</linearGradient>' +
      '<linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0">' +
        '<stop offset="0%" stop-color="#FF3D8B"/>' +
        '<stop offset="100%" stop-color="#FF9A1F"/>' +
      '</linearGradient>' +
    '</defs>';

    for (var k = 0; k < 4; k++) {
      var gy = PT + ih * k / 3;
      svg += '<line x1="' + PL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + gy.toFixed(1) +
             '" stroke="#F3E9F3" stroke-width="1"' + (k === 3 ? '' : ' stroke-dasharray="3 5"') + '/>';
    }

    /* ---- 金价曲线 ---- */
    if (price.length >= 2) {
      var d = '';
      price.forEach(function (p, i) { d += (i ? 'L' : 'M') + X(p.t).toFixed(1) + ',' + Y(p.c).toFixed(1); });
      var xa = X(price[0].t).toFixed(1), xb = X(price[price.length - 1].t).toFixed(1);
      svg += '<path d="' + d + 'L' + xb + ',' + (PT + ih) + 'L' + xa + ',' + (PT + ih) + 'Z" fill="url(#gFill)"/>';
      svg += '<path d="' + d + '" fill="none" stroke="url(#gLine)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
      var lp = price[price.length - 1];
      svg += '<circle cx="' + X(lp.t).toFixed(1) + '" cy="' + Y(lp.c).toFixed(1) + '" r="4.5" fill="#FF3D8B" stroke="#fff" stroke-width="2"/>';
    }

    /* ---- 持仓均价阶梯曲线（每笔交易后一个台阶） ---- */
    segs.forEach(function (seg, si) {
      var path = '';
      seg.forEach(function (p, i) {
        var px = X(p.t).toFixed(1), py = Y(p.v).toFixed(1);
        if (i === 0) path += 'M' + px + ',' + py;
        else path += 'L' + px + ',' + Y(seg[i - 1].v).toFixed(1) + 'L' + px + ',' + py;
      });
      if (si === segs.length - 1) path += 'L' + (W - PR) + ',' + Y(seg[seg.length - 1].v).toFixed(1);
      // 白色描边打底，保证压在粉色曲线上也看得清
      svg += '<path d="' + path + '" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".9" vector-effect="non-scaling-stroke"/>';
      svg += '<path d="' + path + '" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
      seg.forEach(function (p) {
        svg += '<circle cx="' + X(p.t).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="3.4" fill="#8B5CF6" stroke="#fff" stroke-width="1.8"/>';
      });
    });
    svg += '</svg>';

    var fd = function (t) { return new Date(t).toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' }); };
    var out = svg + '<div class="axis"><span>' + fd(t0) + '</span><span>高 ' + realHi.toFixed(1) + ' · 低 ' + realLo.toFixed(1) + '</span><span>' + fd(t1) + '</span></div>';

    var lg = '<div class="legend">';
    if (price.length >= 2) {
      lg += '<span><i style="background:linear-gradient(90deg,#FF3D8B,#FF9A1F)"></i>金价 <b>' + fmt(price[price.length - 1].c, 2) + '</b></span>';
    }
    if (avgPts.length) {
      lg += '<span><i style="background:repeating-linear-gradient(90deg,#8B5CF6 0 5px,transparent 5px 10px)"></i>持仓均价 <b>' + fmt(avgPts[avgPts.length - 1].v, 2) + '</b></span>';
    }
    el.innerHTML = out + lg + '</div>';
  }

  /* ---------------- 渲染：记录 ---------------- */
  function renderRecords() {
    var list = $('#recList'), empty = $('#recEmpty');
    var rs = state.records.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    $('#recCount').textContent = rs.length + ' 笔';
    if (!rs.length) { empty.hidden = false; list.innerHTML = ''; return; }
    empty.hidden = true;

    var h = '';
    rs.forEach(function (r) {
      var g = num(r.grams), p = num(r.price), fee = num(r.fee);
      var amt = g * p + (r.side === 'buy' ? fee : -fee);
      h += '<div class="rec ' + r.side + '" data-id="' + r.id + '">' +
        '<div class="tag">' + (r.side === 'buy' ? '买入' : '卖出') + '</div>' +
        '<div class="main">' +
          '<div class="l1"><span>' + gfmt(g) + ' g × ' + fmt(p, 2) + '</span>' +
          '<span class="amt">' + (r.side === 'buy' ? '-' : '+') + money(amt) + '</span></div>' +
          '<div class="l2"><span>' + r.date + '</span>' +
          (fee > 0 ? '<span>手续费 ' + fmt(fee, 2) + '</span>' : '') +
          (r.note ? '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.note) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="ops">' +
          '<button data-act="edit" title="编辑">✎</button>' +
          '<button data-act="del" title="删除">🗑</button>' +
        '</div>' +
      '</div>';
    });
    list.innerHTML = h;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderAll() {
    computeStats();
    renderPrice();
    renderStats();
    renderChart();
    renderRecords();
  }

  /* ---------------- 持久化 ---------------- */
  function saveData(touch) {
    writeLS(K.rec, state.records);
    writeLS(K.set, state.settings);
    writeLS(K.hist, state.hist);
    if (touch !== false) {
      state.meta.updatedAt = Date.now();
      writeLS(K.meta, state.meta);
      scheduleSync();
    }
  }
  function saveSync() { writeLS(K.sync, state.sync); }

  /* ---------------- 金价 ---------------- */
  function setSpot(obj) {
    state.spot = Object.assign({ ts: Date.now() }, obj);
    state.err = '';
    writeLS(K.spot, state.spot);
    pushHistory(state.spot.cny);
  }

  function pushHistory(c) {
    if (!(c > 0)) return;
    var h = state.hist, now = Date.now(), last = h[h.length - 1];
    if (last && now - last.t < SAMPLE_GAP) { last.c = c; }
    else { h.push({ t: now, c: c }); }
    if (h.length > 4000) h.splice(0, h.length - 4000);
    writeLS(K.hist, h);
  }

  function fetchAuto() {
    var prem = num(state.settings.premium);
    var manualFx = num(state.settings.usdCny);
    return Promise.all([
      fetchJSON('https://api.gold-api.com/price/XAU'),
      manualFx > 0 ? Promise.resolve(null)
        : fetchJSON('https://open.er-api.com/v6/latest/USD').catch(function () { return null; })
    ]).then(function (res) {
      var g = res[0], fx = res[1];
      var usdPerOz = num(g && g.price);
      if (!(usdPerOz > 0)) throw new Error('返回数据异常');
      var rate = manualFx > 0 ? manualFx : num(fx && fx.rates && fx.rates.CNY);
      if (!(rate > 0)) rate = 7.1;
      var cny = usdPerOz / OZ * rate + prem;
      return { cny: cny, usdPerOz: usdPerOz, usdCny: rate, src: '国际金价折算' };
    }, function () {
      throw new Error('网络不通（可改用代理或手动）');
    });
  }

  function fetchProxy() {
    var url = (state.settings.proxy || '').trim();
    if (!url) return Promise.reject(new Error('未填代理地址'));
    return fetchJSON(url).then(function (d) {
      var cny = num(d && (d.cny != null ? d.cny : (d.price != null ? d.price : d.priceCnyPerGram)));
      if (!(cny > 0)) throw new Error('返回格式不对');
      return {
        cny: cny,
        usdPerOz: num(d.usdPerOz),
        usdCny: num(d.usdCny),
        src: d.source ? ('代理 · ' + d.source) : '自定义代理'
      };
    });
  }

  function refreshPrice(silent) {
    var s = state.settings;
    if (s.source === 'manual') {
      var p = num(s.manual);
      if (p > 0) { setSpot({ cny: p, usdPerOz: 0, usdCny: 0, src: '手动填写' }); renderAll(); return Promise.resolve(); }
      state.err = '请先在设置里填写金价';
      renderPrice();
      return Promise.resolve();
    }
    if (state.busy) return Promise.resolve();
    state.busy = true; state.err = '';
    renderPrice();

    var task = s.source === 'proxy' ? fetchProxy() : fetchAuto();
    return task.then(function (r) {
      state.busy = false;
      setSpot({ cny: r.cny, usdPerOz: r.usdPerOz || 0, usdCny: r.usdCny || 0, src: r.src });
      renderAll();
    }).catch(function (e) {
      state.busy = false;
      state.err = e && e.name === 'AbortError' ? '超时' : (e && e.message ? e.message : '失败');
      renderPrice();
      if (!silent) toast('金价获取失败：' + state.err);
    });
  }

  /* ---------------- 记录 CRUD ---------------- */
  var editingId = null, lastField = '';

  function openRec(rec) {
    editingId = rec ? rec.id : null;
    $('#recTitle').textContent = rec ? '编辑记录' : '添加记录';
    $('#rId').value = rec ? rec.id : '';
    $('#rDate').value = rec ? rec.date : todayStr();
    $('#rGrams').value = rec ? num(rec.grams) : '';
    $('#rPrice').value = rec ? num(rec.price)
      : (stats && stats.spot > 0 ? (Math.round(stats.spot * 100) / 100) : '');
    $('#rAmount').value = rec ? fmt(num(rec.grams) * num(rec.price), 2).replace(/,/g, '') : '';
    $('#rFee').value = rec && num(rec.fee) ? num(rec.fee) : '';
    $('#rNote').value = rec && rec.note ? rec.note : '';
    lastField = '';
    setSide(rec ? rec.side : 'buy');
    openModal('modalRec');
    if (!rec) setTimeout(function () { $('#rGrams').focus(); }, 220);
  }

  function setSide(side) {
    $$('#modalRec .seg-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.side === side);
    });
    $('#modalRec').dataset.side = side;
  }
  function getSide() { return $('#modalRec').dataset.side || 'buy'; }

  function syncFields(from) {
    var g = num($('#rGrams').value), p = num($('#rPrice').value), a = num($('#rAmount').value);
    if (from === 'grams') {
      if (p > 0) $('#rAmount').value = trimNum(g * p);
      else if (a > 0 && g > 0) $('#rPrice').value = trimNum(a / g);
    } else if (from === 'price') {
      if (g > 0) $('#rAmount').value = trimNum(g * p);
      else if (a > 0 && p > 0) $('#rGrams').value = trimNum(a / p);
    } else if (from === 'amount') {
      if (g > 0) $('#rPrice').value = trimNum(a / g);
      else if (p > 0) $('#rGrams').value = trimNum(a / p);
    }
  }
  function trimNum(n) {
    if (!isFinite(n)) return '';
    return String(Math.round(n * 10000) / 10000);
  }

  function submitRec(e) {
    e.preventDefault();
    var g = num($('#rGrams').value), p = num($('#rPrice').value), a = num($('#rAmount').value);
    if (!(g > 0) && a > 0 && p > 0) { g = a / p; }
    if (!(p > 0) && a > 0 && g > 0) { p = a / g; }
    if (!(g > 0)) { toast('请填写克重'); return; }
    if (!(p > 0)) { toast('请填写单价或总金额'); return; }

    var rec = {
      id: editingId || uid(),
      date: $('#rDate').value || todayStr(),
      side: getSide(),
      grams: Math.round(g * 1000) / 1000,
      price: Math.round(p * 10000) / 10000,
      fee: Math.round(num($('#rFee').value) * 100) / 100,
      note: $('#rNote').value.trim(),
      createdAt: Date.now()
    };

    if (editingId) {
      var i = state.records.findIndex(function (r) { return r.id === editingId; });
      if (i >= 0) { rec.createdAt = state.records[i].createdAt || Date.now(); state.records[i] = rec; }
    } else {
      state.records.push(rec);
    }
    saveData();
    renderAll();
    closeModal('modalRec');
    toast(editingId ? '已更新' : '已记录 ' + gfmt(rec.grams) + ' g');
    editingId = null;
  }

  /* ---------------- 弹窗 ---------------- */
  function openModal(id) { $('#' + id).hidden = false; document.body.style.overflow = 'hidden'; }
  function closeModal(id) { $('#' + id).hidden = true; document.body.style.overflow = ''; }

  /* ---------------- 设置 ---------------- */
  function openSettings() {
    var s = state.settings;
    $('#sSource').value = s.source;
    $('#sManual').value = s.manual ? trimNum(s.manual) : '';
    $('#sProxy').value = s.proxy || '';
    $('#sPremium').value = s.premium ? trimNum(s.premium) : '';
    $('#sUsdCny').value = s.usdCny ? trimNum(s.usdCny) : '';
    $('#sToken').value = state.sync.token || '';
    $('#sGist').value = state.sync.gistId || '';
    $('#sAutoSync').checked = !!state.sync.auto;
    toggleSourceBoxes();
    openModal('modalSet');
  }
  function toggleSourceBoxes() {
    var v = $('#sSource').value;
    $('#boxManual').hidden = v !== 'manual';
    $('#boxProxy').hidden = v !== 'proxy';
    $('#boxAuto').hidden = v !== 'auto';
    $('#srcHint').textContent =
      v === 'auto' ? '直连公开接口，无需任何配置，适合网络通畅的环境。' :
      v === 'proxy' ? '自己部署的代理，可拿到国内金价，速度更稳。' :
      '完全离线，金价自己填。';
  }
  function saveSettings() {
    state.settings = {
      source: $('#sSource').value,
      manual: num($('#sManual').value),
      proxy: $('#sProxy').value.trim(),
      premium: num($('#sPremium').value),
      usdCny: num($('#sUsdCny').value)
    };
    state.sync.token = $('#sToken').value.trim();
    state.sync.gistId = $('#sGist').value.trim();
    state.sync.auto = $('#sAutoSync').checked;
    saveSync(); saveData(false);
    closeModal('modalSet');
    toast('设置已保存');
    refreshPrice(true);
  }

  /* ---------------- 云同步（GitHub Gist） ---------------- */
  var syncTimer = null, syncing = false;
  function scheduleSync() {
    if (!state.sync.token || !state.sync.gistId || !state.sync.auto) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { doSync(true); }, 2500);
  }

  function gh(path, opts) {
    opts = opts || {};
    var headers = {
      'Accept': 'application/vnd.github+json',
      'Authorization': 'Bearer ' + state.sync.token,
      'X-GitHub-Api-Version': '2022-11-28'
    };
    if (opts.body) headers['Content-Type'] = 'application/json';
    return fetch('https://api.github.com' + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body
    }).then(function (r) {
      if (r.status === 204 || r.status === 304) return null;
      return r.json().then(function (d) {
        if (!r.ok) throw new Error((d && d.message) || ('HTTP ' + r.status));
        return d;
      });
    });
  }

  function docPayload() {
    return {
      app: 'gold-ledger',
      version: 1,
      updatedAt: state.meta.updatedAt || Date.now(),
      records: state.records,
      settings: state.settings,
      hist: state.hist.slice(-2000)
    };
  }

  function applyRemote(doc) {
    if (!doc || !Array.isArray(doc.records)) throw new Error('云端数据格式不对');
    state.records = doc.records;
    state.hist = Array.isArray(doc.hist) ? doc.hist : [];
    state.meta.updatedAt = doc.updatedAt || Date.now();
    if (doc.settings) {
      state.settings = Object.assign({}, DEFAULT_SET, doc.settings);
      writeLS(K.set, state.settings);
    }
    writeLS(K.rec, state.records);
    writeLS(K.hist, state.hist);
    writeLS(K.meta, state.meta);
    renderAll();
  }

  function readGistFile(g) {
    var f = g && g.files && g.files[GIST_FILE];
    if (!f) return Promise.reject(new Error('云端还没有数据文件'));
    if (f.truncated && f.raw_url) {
      return fetch(f.raw_url).then(function (r) { return r.text(); }).then(JSON.parse);
    }
    return Promise.resolve(JSON.parse(f.content));
  }

  function doSync(auto) {
    if (syncing) return Promise.resolve();
    if (!state.sync.token) { if (!auto) toast('请先填 GitHub Token'); return Promise.resolve(); }
    if (!state.sync.gistId) { if (!auto) toast('还没有云存档，点「新建云存档」'); return Promise.resolve(); }

    syncing = true;
    $('#btnSync').classList.add('on');
    return gh('/gists/' + state.sync.gistId)
      .then(readGistFile)
      .then(function (remote) {
        var rAt = remote.updatedAt || 0;
        var lAt = state.meta.updatedAt || 0;
        if (lAt > rAt + 1000) {
          return pushGist().then(function () { return 'pushed'; });
        }
        if (rAt > lAt + 1000) {
          applyRemote(remote);
          return 'pulled';
        }
        return 'same';
      })
      .then(function (what) {
        syncing = false;
        if (!auto) {
          toast(what === 'pulled' ? '已拉取云端数据' :
                what === 'pushed' ? '已上传本机数据' : '已是最新');
        }
      })
      .catch(function (e) {
        syncing = false;
        toast('同步失败：' + e.message);
      });
  }

  function pushGist() {
    var body = JSON.stringify({
      files: (function () {
        var o = {};
        o[GIST_FILE] = { content: JSON.stringify(docPayload(), null, 2) };
        return o;
      })()
    });
    return gh('/gists/' + state.sync.gistId, { method: 'PATCH', body: body });
  }

  function createGist() {
    // 直接读输入框，避免用户没点「保存设置」时令牌还没进 state
    state.sync.token = ($('#sToken').value || '').trim();
    if (!state.sync.token) { toast('请先填 GitHub Token'); return; }
    $('#btnGistCreate').textContent = '创建中…';
    var body = JSON.stringify({
      description: '黄金账本 gold-ledger 数据（建议设为 secret gist）',
      public: false,
      files: (function () {
        var o = {};
        o[GIST_FILE] = { content: JSON.stringify(docPayload(), null, 2) };
        return o;
      })()
    });
    gh('/gists', { method: 'POST', body: body })
      .then(function (r) {
        state.sync.gistId = r.id;
        saveSync();
        $('#sGist').value = r.id;
        return pushGist().then(
          function () { toast('云存档已创建，本机数据已上传'); },
          function () { toast('云存档已创建（上传失败，稍后点「立即同步」）'); }
        );
      })
      .catch(function (e) { toast('创建失败：' + e.message); })
      .then(function () { $('#btnGistCreate').textContent = '新建云存档'; });
  }

  /* ---------------- 导入导出 ---------------- */
  function download(name, text, type) {
    var blob = new Blob([text], { type: type || 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 400);
  }
  function stamp() {
    var d = new Date(), p = function (x) { return x < 10 ? '0' + x : '' + x; };
    return '' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }
  function exportJSON() {
    download('黄金账本-' + stamp() + '.json', JSON.stringify(docPayload(), null, 2));
    toast('已导出备份');
  }
  function exportCSV() {
    var rows = [['日期', '方向', '克重(g)', '单价(元/g)', '金额(元)', '手续费(元)', '备注']];
    state.records.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (r) {
      var g = num(r.grams), p = num(r.price), f = num(r.fee);
      rows.push([r.date, r.side === 'buy' ? '买入' : '卖出', g, p, (g * p).toFixed(2), f.toFixed(2), r.note || '']);
    });
    var csv = '\uFEFF' + rows.map(function (row) {
      return row.map(function (c) {
        c = String(c);
        return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
      }).join(',');
    }).join('\r\n');
    download('黄金账本-' + stamp() + '.csv', csv, 'text/csv;charset=utf-8');
    toast('已导出 CSV');
  }
  function importJSON(file) {
    var fr = new FileReader();
    fr.onload = function () {
      var doc;
      try { doc = JSON.parse(String(fr.result)); }
      catch (e) { toast('文件解析失败'); return; }
      if (!doc || !Array.isArray(doc.records)) { toast('不是有效的备份文件'); return; }
      if (!confirm('导入将覆盖当前 ' + state.records.length + ' 条记录，确定？')) return;
      applyRemote(doc);
      state.meta.updatedAt = Date.now();
      writeLS(K.meta, state.meta);
      saveData();
      toast('已导入 ' + doc.records.length + ' 条记录');
    };
    fr.readAsText(file);
  }

  /* ---------------- 事件绑定 ---------------- */
  function bind() {
    $('#fab').addEventListener('click', function () { openRec(null); });
    $$('[data-close]').forEach(function (b) {
      b.addEventListener('click', function () { closeModal(b.dataset.close); });
    });
    $$('.modal').forEach(function (m) {
      m.addEventListener('click', function (e) { if (e.target === m) closeModal(m.id); });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') $$('.modal').forEach(function (m) { if (!m.hidden) closeModal(m.id); });
    });

    $('#formRec').addEventListener('submit', submitRec);
    $$('#modalRec .seg-btn').forEach(function (b) {
      b.addEventListener('click', function () { setSide(b.dataset.side); });
    });
    $('#rGrams').addEventListener('input', function () { lastField = 'grams'; syncFields('grams'); });
    $('#rPrice').addEventListener('input', function () { lastField = 'price'; syncFields('price'); });
    $('#rAmount').addEventListener('input', function () { lastField = 'amount'; syncFields('amount'); });

    $('#recList').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-act]');
      if (!btn) return;
      var row = btn.closest('.rec');
      var id = row && row.dataset.id;
      var rec = state.records.find(function (r) { return r.id === id; });
      if (!rec) return;
      if (btn.dataset.act === 'edit') { openRec(rec); return; }
      if (btn.dataset.act === 'del') {
        if (!confirm('删除 ' + rec.date + ' 的 ' + (rec.side === 'buy' ? '买入' : '卖出') + '记录？')) return;
        state.records = state.records.filter(function (r) { return r.id !== id; });
        saveData(); renderAll(); toast('已删除');
      }
    });

    $('#btnRefresh').addEventListener('click', function () { refreshPrice(false); });
    $('#btnSettings').addEventListener('click', openSettings);
    $('#btnSync').addEventListener('click', function () {
      if (!state.sync.token || !state.sync.gistId) { openSettings(); toast('先配置云同步'); return; }
      doSync(false);
    });
    $('#sSource').addEventListener('change', toggleSourceBoxes);
    $('#btnSaveSet').addEventListener('click', saveSettings);
    $('#btnGistCreate').addEventListener('click', createGist);
    $('#btnGistSync').addEventListener('click', function () {
      state.sync.token = $('#sToken').value.trim();
      state.sync.gistId = $('#sGist').value.trim();
      saveSync();
      doSync(false);
    });
    $('#btnExport').addEventListener('click', exportJSON);
    $('#btnCsv').addEventListener('click', exportCSV);
    $('#btnImport').addEventListener('click', function () { $('#fileImport').click(); });
    $('#fileImport').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (f) importJSON(f);
      e.target.value = '';
    });
    $('#btnClear').addEventListener('click', function () {
      if (!confirm('确定清空全部 ' + state.records.length + ' 条记录？建议先导出备份。')) return;
      if (!confirm('再确认一次：清空后无法恢复。')) return;
      state.records = [];
      state.hist = [];
      saveData(); renderAll(); toast('已清空');
    });

    // 回到前台时刷新
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && state.spot && Date.now() - state.spot.ts > 5 * 60000) refreshPrice(true);
    });
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    bind();
    renderAll();
    refreshPrice(true);
    if (state.sync.token && state.sync.gistId) doSync(true);
    setInterval(function () { if (!document.hidden) refreshPrice(true); }, 5 * 60 * 1000);

    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  }

  /* 调试钩子：浏览器控制台里 __GL__ 可以查看/重算数据 */
  try {
    window.__GL__ = {
      state: state,
      compute: computeStats,
      stats: function () { return computeStats(); },
      render: renderAll,
      avgSegments: buildAvgSegments,
      applyRemote: applyRemote,
      docPayload: docPayload
    };
  } catch (e) {}

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
