<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>黄金账本 · 持仓均价与实时金价</title>
<meta name="theme-color" content="#FFF7F0">
<meta name="description" content="记录每笔黄金买卖，自动算持仓均价、浮动盈亏，实时金价一目了然。">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="黄金账本">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* 暖白底 + 陶土色，去掉所有高饱和撞色 */
  --bg:#FBF7F2;
  --card:#FFFFFF;
  --ink:#2E241C;
  --ink2:#7A6A5C;
  --ink3:#A9988A;
  --line:#EFE3D6;
  --line2:#E6D6C4;

  --accent:#C2703D;        /* 陶土 */
  --accent-deep:#A6552A;
  --accent-soft:#F7EADF;
  --amber:#B45309;

  --gain:#C2410C;          /* 涨 / 盈 */
  --loss:#5F7F63;          /* 跌 / 亏 */

  --r:20px;--r2:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --shadow:0 8px 22px -14px rgba(120,80,50,.45);
}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(760px 380px at 50% -12%,rgba(224,160,100,.16),transparent 62%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh;
  padding:0 14px calc(104px + var(--safe-b));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 14px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:var(--ink);letter-spacing:.01em}
.logo{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:var(--accent);color:#fff;font:700 13px/1 Georgia,serif;
  box-shadow:0 6px 14px -8px rgba(194,112,61,.9);
}
.actions{display:flex;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);color:var(--ink2);
  font-size:15px;transition:.15s;
}
.icon-btn:active{transform:scale(.95)}
.icon-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px -8px rgba(194,112,61,.95)}
.sync-state{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin:2px 0 12px;padding:10px 12px;border-radius:12px;background:#FAF5F0;border:1px solid var(--line);line-height:1.45}
.sync-state i{width:7px;height:7px;border-radius:50%;background:#C9B8A6;flex:0 0 auto}
.sync-state.ok{color:#2F6B3F;background:#F1F8F2;border-color:#D9EBDE}
.sync-state.ok i{background:#2E7D45}
.sync-state.err{color:#A8400F;background:#FDF1EC;border-color:#F4D8CC}
.sync-state.err i{background:#C2410C}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 10px;font-size:12.5px;color:var(--ink3)}
.sec-title b{font-weight:700;color:var(--ink);font-size:15px}

/* ---------- 金价卡（暖色、安静） ---------- */
.price-card{
  padding:18px;position:relative;overflow:hidden;
  background:linear-gradient(165deg,#FFF8F0 0%,#FCEDDC 100%);
  border:1px solid #F2DFC9;
  box-shadow:0 10px 26px -18px rgba(160,110,60,.6);
}
.pc-top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(194,112,61,.16)}
.dot.err{background:#C2410C;box-shadow:0 0 0 3px rgba(194,65,12,.14)}
.dot.busy{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.pc-price{display:flex;align-items:baseline;gap:7px;margin:8px 0 3px}
.pc-price .v{
  font-size:42px;font-weight:750;letter-spacing:-.025em;color:var(--amber);
  font-variant-numeric:tabular-nums;line-height:1.06;
}
.pc-price .u{font-size:14px;color:var(--ink2);font-weight:600}
.pc-sub{font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 12px}
.pc-sub .k{color:var(--ink3)}
.pc-refresh{
  font-size:12px;font-weight:600;padding:5px 13px;border-radius:9px;
  background:#fff;border:1px solid var(--line2);color:var(--accent-deep);
  transition:.15s;flex:0 0 auto;
}
.pc-refresh:active{transform:scale(.95);background:#FFF6EE}

/* ---------- 统计格 ---------- */
.stats{margin-top:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.stat{padding:14px 15px;border-radius:var(--r2);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.stat .k{font-size:12.5px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:5px}
.stat .v{font-size:21px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink);line-height:1.2}
.stat .s{font-size:11.5px;color:var(--ink3);margin-top:3px}

.stat.hero{grid-column:1/-1;background:linear-gradient(160deg,#FDF3E8,#FBEDDF);border-color:#F2DFC9;transition:background .25s,border-color .25s}
.stat.hero .k{color:var(--accent-deep)}
.stat.hero .v{font-size:34px;color:var(--amber);transition:color .25s}
/* 浮盈 → 红；浮亏 → 绿（A股习惯） */
.stat.hero.is-gain{background:linear-gradient(160deg,#FDEDE7,#F9DCD2);border-color:#F1C9BA}
.stat.hero.is-gain .k{color:#A8400F}
.stat.hero.is-gain .v{color:#BC3A08}
.stat.hero.is-gain .badge{background:#FADFD5;color:#B93A08;border-color:#F1C9BA}
.stat.hero.is-loss{background:linear-gradient(160deg,#E9F5EB,#D8EBDE);border-color:#C4E1CB}
.stat.hero.is-loss .k{color:#2F6B3F}
.stat.hero.is-loss .v{color:#23713A}
.stat.hero.is-loss .badge{background:#D6EBDC;color:#23713A;border-color:#C0E0C8}

.stat.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.stat.wide .v{margin-top:0}

.up{color:var(--gain)!important}
.dn{color:var(--loss)!important}
.flat{color:var(--ink2)!important}

/* ---------- 图表 ---------- */
.chart-card{padding:12px 10px 8px;position:relative}
.chart-guide{position:absolute;width:1px;background:rgba(120,80,50,.3);pointer-events:none;z-index:3}
.chart-tip{
  position:absolute;z-index:4;pointer-events:none;background:#fff;
  border:1px solid var(--line2);border-radius:11px;padding:8px 12px;
  font-size:11.5px;line-height:1.5;white-space:nowrap;
  box-shadow:0 10px 24px -12px rgba(90,60,35,.65);transform:translateX(-50%);
}
.chart-tip .t1{color:var(--ink3);font-size:11px}
.chart-tip .t2{font-weight:700;font-size:13.5px;margin-top:1px;color:var(--ink)}
.chart-tip .t2.buy{color:#A6552A}
.chart-tip .t2.sell{color:#3F6B4A}
.chart-tip .t3{color:var(--ink2);font-size:11px;margin-top:1px}
#chart{display:block;width:100%}
#chart .empty{padding:46px 18px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.9}
#chart .empty b{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:6px 10px 2px;font-size:11.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:3px;border-radius:2px;display:inline-block;flex:0 0 auto}
.legend b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);padding:6px 10px 2px}
.chart-note{font-size:10.5px;color:var(--ink3);padding:2px 12px 8px;line-height:1.5}
.chart-tools{display:flex;align-items:center;gap:10px;padding:8px 12px 10px;border-top:1px solid var(--line);margin-top:6px}
.rt-cap{font-size:11.5px;color:var(--ink3);flex:0 0 auto}
.rt-val{font-size:11.5px;color:var(--ink2);font-weight:600;min-width:54px;text-align:right;flex:0 0 auto}
#rangeSlider{-webkit-appearance:none;appearance:none;flex:1;height:20px;background:transparent;cursor:pointer;margin:0}
#rangeSlider::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--line)}
#rangeSlider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-6.5px;border:2px solid #fff;box-shadow:0 2px 6px rgba(120,80,50,.45)}
#rangeSlider::-moz-range-track{height:5px;border-radius:3px;background:var(--line)}
#rangeSlider::-moz-range-thumb{width:16px;height:16px;border:2px solid #fff;border-radius:50%;background:var(--accent);box-shadow:0 2px 6px rgba(120,80,50,.45)}

/* ---------- 记录 ---------- */
.rec{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .tag{flex:0 0 auto;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:12px;font-weight:700}
.rec.buy .tag{background:#FBEDE2;color:#A6552A}
.rec.sell .tag{background:#EDF3EE;color:#4C6B50}
.rec .main{flex:1;min-width:0}
.rec .l1{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.rec .l1>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .l1 .amt{font-weight:700;white-space:nowrap;flex:0 0 auto}
.rec.buy .l1 .amt{color:#A6552A}
.rec.sell .l1 .amt{color:#4C6B50}
.rec .l2{font-size:12px;color:var(--ink3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.rec .ops{display:flex;gap:2px;flex:0 0 auto}
.rec .ops button{padding:7px 8px;border-radius:9px;color:var(--ink3);font-size:13px}
.rec .ops button:active{background:#F8F2EA}
.empty-box{padding:38px 16px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.95}

/* ---------- 悬浮按钮 ---------- */
.fab{
  position:fixed;right:calc(50% - 360px + 18px);bottom:calc(24px + var(--safe-b));
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:var(--accent);color:#fff;font-size:28px;font-weight:300;line-height:1;padding-bottom:3px;
  box-shadow:0 12px 26px -10px rgba(194,112,61,.85);
  transition:.15s;z-index:20;
}
@media(max-width:760px){.fab{right:18px;bottom:calc(22px + var(--safe-b))}}
.fab:active{transform:scale(.94)}

/* ---------- 弹窗 ---------- */
.modal{
  position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(46,36,28,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:fade .16s ease;
}
.modal[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.sheet{
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--card);border-radius:24px 24px 0 0;padding:0 0 calc(18px + var(--safe-b));
  animation:slide .22s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -10px 34px -14px rgba(90,60,35,.45);
}
@keyframes slide{from{transform:translateY(26px);opacity:.6}}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:22px;max-height:86vh;padding-bottom:18px}}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 18px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:17px;font-weight:700}
.sheet-body{padding:18px 18px 0}
.field{display:block;margin-bottom:13px}
.field>span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:7px;font-weight:600}
.field input,.field select{
  width:100%;padding:13px 14px;border-radius:12px;background:#FDFAF7;
  border:1px solid var(--line2);outline:none;font-size:16px;color:var(--ink);
  transition:border-color .15s,background .15s;
}
.field input:focus,.field select:focus{border-color:#D9A97F;background:#fff}
.field input::placeholder{color:#C4B4A5}
.field .hint{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.6}
.field .hint b{color:var(--ink2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#F7F1EA;padding:5px;border-radius:14px;margin-bottom:16px}
.seg-btn{padding:11px;border-radius:10px;font-size:14px;color:var(--ink3);transition:.15s;font-weight:600}
.seg-btn.active{background:#fff;color:var(--ink);box-shadow:0 3px 10px -6px rgba(90,60,35,.6)}
.seg-btn[data-side=buy].active{background:#FBEDE2;color:#A6552A}
.seg-btn[data-side=sell].active{background:#EDF3EE;color:#4C6B50}
.sheet-foot{display:flex;gap:11px;padding:16px 18px 0;position:sticky;bottom:0;background:linear-gradient(180deg,transparent,#fff 24%)}
.btn{
  flex:1;padding:14px;border-radius:13px;font-size:15px;font-weight:700;text-align:center;
  background:#F7F1EA;border:1px solid var(--line2);color:var(--ink);transition:.15s;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 8px 20px -10px rgba(194,112,61,.9)}
.btn.danger{color:#B3261E;background:#FDF3F2;border-color:#F3DAD6}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.sm{flex:0 0 auto;padding:10px 14px;font-size:13px;border-radius:11px}
.group{margin:22px 0 10px;font-size:12px;color:var(--ink3);letter-spacing:.05em;font-weight:700}
.divider{height:1px;background:var(--line);margin:16px 0}

/* ---------- toast / badge ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(98px + var(--safe-b));transform:translate(-50%,10px);
  background:#2E241C;color:#fff;padding:12px 20px;border-radius:13px;
  font-size:13.5px;z-index:99;opacity:0;pointer-events:none;transition:.22s;
  max-width:86vw;text-align:center;box-shadow:0 14px 32px -14px rgba(46,36,28,.8);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.badge{font-size:11px;padding:2px 8px;border-radius:7px;background:#F7F1EA;color:var(--ink2);border:1px solid var(--line);font-weight:600}
.badge:empty{display:none}
.badge.warn{background:#FDF3F2;color:#B3261E;border-color:#F3DAD6}
.disclaimer{text-align:center;color:var(--ink3);font-size:11.5px;margin:24px 0 0;line-height:1.75}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand"><span class="logo">Au</span>黄金账本</div>
    <div class="actions">
      <button class="icon-btn" id="btnReload" title="重新加载">↻</button>
      <button class="icon-btn" id="btnSync" title="云同步">☁</button>
      <button class="icon-btn" id="btnSettings" title="设置">⚙</button>
    </div>
  </div>

  <!-- 实时金价 -->
  <section class="card price-card">
    <div class="pc-top">
      <span class="dot" id="priceDot"></span>
      <span id="priceState">—</span>
      <span style="flex:1"></span>
      <button class="pc-refresh" id="btnCalib" title="用中行 App 上的价格校准">校准</button>
      <button class="pc-refresh" id="btnRefresh">刷新</button>
    </div>
    <div class="pc-price">
      <span class="v" id="price">—</span>
      <span class="u">元 / 克</span>
    </div>
    <div class="pc-sub">
      <span><span class="k">来源</span> <span id="priceSrc">—</span></span>
      <span><span class="k">取价</span> <span id="priceTime">—</span></span>
      <span id="priceRef"></span>
    </div>
  </section>

  <!-- 统计 -->
  <section class="stats" id="stats">
    <div class="stat hero" id="heroCard">
      <div class="k">持仓均价 <span class="badge" id="avgHint"></span></div>
      <div class="v" id="sAvg">—</div>
      <div class="s" id="sAvgSub">—</div>
    </div>
    <div class="stat">
      <div class="k">持有克重</div>
      <div class="v" id="sGrams">—</div>
      <div class="s" id="sGramsSub">—</div>
    </div>
    <div class="stat">
      <div class="k">持仓成本</div>
      <div class="v" id="sCost">—</div>
      <div class="s" id="sCostSub">—</div>
    </div>
    <div class="stat">
      <div class="k">当前市值</div>
      <div class="v" id="sValue">—</div>
      <div class="s" id="sValueSub">—</div>
    </div>
    <div class="stat">
      <div class="k">浮动盈亏</div>
      <div class="v" id="sUnreal">—</div>
      <div class="s" id="sUnrealSub">—</div>
    </div>
    <div class="stat wide">
      <div class="k">已实现盈亏</div>
      <div class="v" id="sReal">—</div>
      <div class="s" id="sRealSub">—</div>
    </div>
  </section>

  <!-- 走势 -->
  <div class="sec-title"><b>金价走势</b><span id="chartHint">本地采样</span></div>
  <section class="card chart-card">
    <div id="chart"></div>
    <div class="chart-guide" id="chartGuide" hidden></div>
    <div class="chart-tip" id="chartTip" hidden></div>
    <div class="chart-tools">
      <span class="rt-cap">区间</span>
      <input type="range" id="rangeSlider" min="0" max="11" step="1" value="5" aria-label="显示区间">
      <span class="rt-val" id="rangeLabel">3 个月</span>
    </div>
  </section>

  <!-- 记录 -->
  <div class="sec-title"><b>交易记录</b><span id="recCount">0 笔</span></div>
  <section class="card" id="recBox">
    <div class="empty-box" id="recEmpty">
      还没有记录<br>
      点右下角 <b style="color:#C2703D">+</b> 记下第一笔买入
    </div>
    <div id="recList"></div>
  </section>

  <p class="disclaimer">数据保存在本机浏览器 · 金价仅供参考，不构成投资建议</p>
</div>

<button class="fab" id="fab" aria-label="添加记录">+</button>

<!-- 记录弹窗 -->
<div class="modal" id="modalRec" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="recTitle">添加记录</h2>
      <button class="icon-btn" data-close="modalRec" style="width:30px;height:30px">✕</button>
    </div>
    <form id="formRec" autocomplete="off">
      <div class="sheet-body">
        <input type="hidden" id="rId">
        <div class="seg">
          <button type="button" class="seg-btn active" data-side="buy">买入</button>
          <button type="button" class="seg-btn" data-side="sell">卖出</button>
        </div>
        <label class="field"><span>日期</span><input id="rDate" type="date"></label>
        <div class="row2">
          <label class="field"><span>克重（g）</span><input id="rGrams" inputmode="decimal" placeholder="0.000"></label>
          <label class="field"><span>单价（元/克）</span><input id="rPrice" inputmode="decimal" placeholder="0.00"></label>
        </div>
        <label class="field"><span>总金额（元）</span>
          <input id="rAmount" inputmode="decimal" placeholder="0.00">
          <div class="hint">克重 / 单价 / 总金额，填任意两个，第三个自动算</div>
        </label>
        <label class="field"><span>手续费（元，可选）</span><input id="rFee" inputmode="decimal" placeholder="0"></label>
        <label class="field"><span>备注（可选）</span><input id="rNote" maxlength="60" placeholder="如：建行金条 / 工行积存金 / 周大福"></label>
      </div>
      <div class="sheet-foot">
        <button type="button" class="btn ghost" data-close="modalRec">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal" id="modalSet" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2>设置</h2>
      <button class="icon-btn" data-close="modalSet" style="width:30px;height:30px">✕</button>
    </div>
    <div class="sheet-body">

      <div class="group">金价来源</div>
      <label class="field"><span>数据源</span>
        <select id="sSource">
          <option value="bank">银行金条牌价（中国银行等 · 每日）</option>
          <option value="auto">国际金价折算人民币（实时）</option>
          <option value="proxy">自定义代理（上金所 / 自有接口）</option>
          <option value="manual">手动填写金价</option>
        </select>
        <div class="hint" id="srcHint"></div>
      </label>
      <div id="boxBank">
        <label class="field"><span>看哪家银行的金条价</span>
          <select id="sBank">
            <option value="中国银行">中国银行金条</option>
            <option value="工商银行">工商银行如意金条</option>
            <option value="建设银行">建设银行龙鼎金条</option>
            <option value="农业银行">农行传世之宝金条</option>
            <option value="浦发银行">浦发银行投资金条</option>
            <option value="平安银行">平安银行金条</option>
          </select>
          <div class="hint">第三方聚合报价，每个交易日更新一次，<b>以银行网点实际成交价为准</b>。</div>
        </label>
      </div>
      <div id="boxOffset">
        <label class="field"><span>偏移校准（元/克）</span>
          <input id="sOffset" inputmode="decimal" placeholder="0">
          <div class="hint">点金价卡上的 <b>校准</b> 会自动算出。正数 = 你的价高于数据源。</div>
        </label>
      </div>
      <div id="boxManual" hidden>
        <label class="field"><span>当前金价（元/克）</span><input id="sManual" inputmode="decimal" placeholder="如 880"></label>
      </div>
      <div id="boxProxy" hidden>
        <label class="field"><span>代理接口地址</span><input id="sProxy" placeholder="https://xxx.workers.dev/" inputmode="url">
          <div class="hint">用仓库里的 <b>worker/gold-price-proxy.js</b> 免费部署一个 Cloudflare Worker，把地址填这里。</div>
        </label>
      </div>
      <div id="boxAuto" hidden>
        <div class="row2">
          <label class="field"><span>折算加价（元/克）</span><input id="sPremium" inputmode="decimal" placeholder="0">
            <div class="hint">国内实售价常高于国际折算价</div>
          </label>
          <label class="field"><span>美元兑人民币</span><input id="sUsdCny" inputmode="decimal" placeholder="自动">
            <div class="hint">留空则自动获取汇率</div>
          </label>
        </div>
      </div>

      <div class="divider"></div>
      <div class="group">云同步（多设备共用一份数据）</div>
      <div class="sync-state" id="syncState"><i></i><span>检查中…</span></div>
      <label class="field"><span>GitHub Token（只需 gist 权限）</span>
        <input id="sToken" type="password" placeholder="github_pat_..." autocomplete="off">
        <div class="hint">在 GitHub → Settings → Developer settings → Personal access tokens 生成，仅勾选 <b>gist</b>。Token 只存在本机浏览器里。</div>
      </label>
      <label class="field"><span>Gist ID</span>
        <input id="sGist" placeholder="留空则点下面「创建」自动生成" autocomplete="off">
      </label>
      <button type="button" class="btn sm" id="btnCopyCfg" style="width:100%;margin-bottom:12px">复制同步配置（换设备用）</button>
      <label class="field"><span>从别的设备搬配置</span>
        <input id="sSyncPaste" placeholder="把复制来的字符串粘这里，自动填好上面两栏" autocomplete="off">
      </label>
      <div class="row2" style="margin-bottom:12px">
        <button type="button" class="btn sm" id="btnGistCreate" style="flex:1">新建云存档</button>
        <button type="button" class="btn sm" id="btnGistSync" style="flex:1">立即同步</button>
      </div>
      <label class="field" style="display:flex;align-items:center;gap:9px;margin-bottom:4px">
        <input type="checkbox" id="sAutoSync" style="width:20px;height:20px;padding:0;flex:0 0 auto;accent-color:#C2703D">
        <span style="margin:0;font-size:14px;color:var(--txt)">改动后自动同步</span>
      </label>

      <div class="divider"></div>
      <div class="group">数据</div>
      <div class="row2" style="margin-bottom:10px">
        <button type="button" class="btn sm" id="btnExport" style="flex:1">导出备份</button>
        <button type="button" class="btn sm" id="btnImport" style="flex:1">导入备份</button>
      </div>
      <div class="row2" style="margin-bottom:10px">
        <button type="button" class="btn sm" id="btnCsv" style="flex:1">导出 CSV</button>
        <button type="button" class="btn sm danger" id="btnClear" style="flex:1">清空数据</button>
      </div>
      <input type="file" id="fileImport" accept=".json,application/json" hidden>

      <div class="sheet-foot" style="padding-left:0;padding-right:0">
        <button type="button" class="btn ghost" data-close="modalSet">关闭</button>
        <button type="button" class="btn primary" id="btnSaveSet">保存设置</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   黄金账本 — 单文件离线应用
   数据：localStorage（可选 GitHub Gist 云同步）
   ========================================================= */
(function () {
  'use strict';

  /* ---------------- 常量 ---------------- */
  var K = {
    rec:  'gl.records.v1',
    set:  'gl.settings.v1',
    hist: 'gl.history.v1',
    meta: 'gl.meta.v1',
    sync: 'gl.sync.v1',
    spot: 'gl.spot.v1'
  };
  var OZ = 31.1034768;          // 1 金衡盎司 = 31.1034768 克
  var GIST_FILE = 'gold-ledger.json';
  var SAMPLE_GAP = 10 * 60 * 1000;   // 金价采样最小间隔

  var DEFAULT_SET = {
    source: 'bank',
    bank: '中国银行',
    offset: 0,
    manual: 0,
    proxy: '',
    premium: 0,
    usdCny: 0,
    rangeIdx: 5
  };

  /* 银行名称别名：接口返回的名字五花八门（工行/工商银行、农行/农业银行） */
  var BANK_ALIAS = {
    '中国银行': ['中国银行'],
    '工商银行': ['工商银行', '工行'],
    '建设银行': ['建设银行', '建行'],
    '农业银行': ['农业银行', '农行'],
    '浦发银行': ['浦发'],
    '平安银行': ['平安']
  };

  /* ---------------- 小工具 ---------------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    var n = parseFloat(String(v == null ? '' : v).replace(/[,\s¥￥%]/g, ''));
    return isFinite(n) ? n : 0;
  }
  function fmt(n, d) {
    n = isFinite(n) ? n : 0;
    return n.toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function money(n) { return '¥' + fmt(n, 2); }
  function gfmt(n) {
    var s = fmt(n, 3);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }
  function signed(n, d) {
    var s = fmt(Math.abs(n), d == null ? 2 : d);
    if (n > 0.0000001) return '+' + s;
    if (n < -0.0000001) return '-' + s;
    return s;
  }
  function pct(n) {
    if (!isFinite(n)) return '';
    return (n > 0 ? '+' : '') + fmt(n * 100, 2) + '%';
  }
  function todayStr() {
    var d = new Date(), p = function (x) { return x < 10 ? '0' + x : '' + x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function readLS(k, fb) {
    try { var s = localStorage.getItem(k); return s == null ? fb : JSON.parse(s); }
    catch (e) { return fb; }
  }
  function writeLS(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { toast('本地存储失败：' + e.message); return false; }
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }
  function timeAgo(ts) {
    if (!ts) return '—';
    var s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (s < 45) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    if (s < 86400 * 30) return Math.floor(s / 86400) + ' 天前';
    var d = new Date(ts), p = function (x) { return x < 10 ? '0' + x : '' + x; };
    return (d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function fetchJSON(url, opts, ms) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, ms || 12000);
    return fetch(url, Object.assign({ signal: ctl.signal, cache: 'no-store' }, opts || {}))
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) { clearTimeout(timer); return d; },
            function (e) { clearTimeout(timer); throw e; });
  }

  /* ---------------- 状态 ---------------- */
  var state = {
    records: readLS(K.rec, []) || [],
    settings: Object.assign({}, DEFAULT_SET, readLS(K.set, {}) || {}),
    hist: readLS(K.hist, []) || [],
    sync: Object.assign({ token: '', gistId: '', auto: true, lastAt: 0, lastErr: '' }, readLS(K.sync, {}) || {}),
    meta: Object.assign({ updatedAt: 0 }, readLS(K.meta, {}) || {}),
    spot: readLS(K.spot, null),
    daily: [],
    dailyErr: '',
    busy: false,
    err: ''
  };
  if (!Array.isArray(state.records)) state.records = [];
  if (!Array.isArray(state.hist)) state.hist = [];

  /* 老配置升级：早期版本没有 bank 字段，默认切到银行牌价 */
  (function () {
    var saved = readLS(K.set, null);
    if (!saved || typeof saved !== 'object') return;
    if (!('bank' in saved)) {
      state.settings.source = 'bank';
      state.settings.bank = '中国银行';
      writeLS(K.set, state.settings);
    }
  })();
  var stats = null;

  /* ---------------- 计算 ---------------- */
  function computeStats() {
    var rs = state.records.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
    var g = 0, cost = 0, realized = 0;
    var buyG = 0, buyAmt = 0, sellG = 0, sellAmt = 0, overSold = false;

    rs.forEach(function (r) {
      var gg = num(r.grams), p = num(r.price), fee = num(r.fee);
      if (gg <= 0) return;
      if (r.side === 'buy') {
        g += gg;
        cost += gg * p + fee;
        buyG += gg;
        buyAmt += gg * p + fee;
      } else {
        if (gg > g + 1e-9) overSold = true;
        var sold = Math.min(gg, g);
        var avg = g > 0 ? cost / g : 0;
        realized += sold * p - (gg > 0 ? fee * (sold / gg) : 0) - sold * avg;
        cost -= sold * avg;
        g -= sold;
        sellG += gg;
        sellAmt += gg * p - fee;
      }
      if (g < 1e-9) { g = 0; cost = 0; }
    });

    var spot = state.spot && state.spot.cny > 0 ? state.spot.cny : 0;
    var avgCost = g > 0 ? cost / g : 0;
    var value = spot > 0 ? g * spot : 0;
    var unreal = spot > 0 ? value - cost : 0;
    var unrealPct = cost > 0 ? unreal / cost : 0;

    stats = {
      grams: g, cost: cost, avgCost: avgCost, realized: realized,
      spot: spot, value: value, unreal: unreal, unrealPct: unrealPct,
      total: unreal + realized,
      buyG: buyG, buyAmt: buyAmt, buyAvg: buyG > 0 ? buyAmt / buyG : 0,
      sellG: sellG, sellAmt: sellAmt,
      overSold: overSold, count: state.records.length
    };
    return stats;
  }

  /* ---------------- 渲染：金价 ---------------- */
  function renderPrice() {
    var s = state.spot;
    var dot = $('#priceDot'), st = $('#priceState');
    dot.className = 'dot';
    if (state.busy) { dot.classList.add('busy'); st.textContent = '获取中…'; }
    else if (state.err) { dot.classList.add('err'); st.textContent = '获取失败 · ' + state.err; }
    else if (s) {
      st.textContent = state.settings.source === 'manual' ? '手动金价'
        : state.settings.source === 'bank' ? '银行牌价' : '实时';
    }
    else { st.textContent = '暂无价格'; }

    $('#price').textContent = s && s.cny > 0 ? fmt(s.cny, 2) : '—';
    $('#priceSrc').textContent = (s && s.src) || '—';
    $('#priceTime').textContent = s ? timeAgo(s.ts) : '—';

    var ref = [];
    if (s && s.usdPerOz > 0) ref.push('$' + fmt(s.usdPerOz, 1) + '/oz');
    if (s && s.usdCny > 0) ref.push('汇率 ' + fmt(s.usdCny, 3));
    $('#priceRef').innerHTML = ref.length ? '<span class="k">' + ref.join(' · ') + '</span>' : '';

    $('#btnSync').classList.toggle('on', !!(state.sync.token && state.sync.gistId));
  }

  /* ---------------- 渲染：云同步状态 ---------------- */
  function renderSyncState() {
    var el = $('#syncState');
    if (!el) return;
    var s = state.sync, cls = 'sync-state', txt = '';
    if (!s.token && !s.gistId) {
      txt = '未配置 · 云同步关闭，数据只存在这台设备';
    } else if (!s.token) {
      cls += ' err'; txt = '缺 GitHub Token，填完点「保存设置」';
    } else if (!s.gistId) {
      cls += ' err'; txt = '缺 Gist ID · 点下方「新建云存档」自动生成';
    } else if (s.lastErr) {
      cls += ' err'; txt = '同步出错：' + s.lastErr;
    } else if (s.lastAt) {
      cls += ' ok'; txt = '已连接 · ' + timeAgo(s.lastAt) + '同步过';
    } else {
      cls += ' ok'; txt = '已连接 · 等待首次同步';
    }
    el.className = cls;
    el.innerHTML = '<i></i><span>' + esc(txt) + '</span>';
  }

  /* ---------------- 渲染：统计 ---------------- */
  function renderStats() {
    var s = stats;
    var hasSpot = s.spot > 0;

    $('#sAvg').textContent = s.grams > 0 ? money(s.avgCost) : '—';
    var diff = hasSpot && s.avgCost > 0 ? (s.spot - s.avgCost) / s.avgCost : 0;
    var hero = $('#heroCard');
    if (hero && hero.classList) hero.classList.remove('is-gain', 'is-loss');
    if (s.grams > 0 && hasSpot && s.avgCost > 0) {
      var above = s.spot >= s.avgCost;
      if (hero && hero.classList) hero.classList.add(above ? 'is-gain' : 'is-loss');
      $('#sAvgSub').innerHTML =
        '<span class="' + (above ? 'up' : 'dn') + '">现价 ' + (above ? '高' : '低') + '于均价 ' +
        fmt(Math.abs(diff) * 100, 2) + '%</span>';
      $('#avgHint').textContent = above ? '浮盈' : '浮亏';
      $('#avgHint').className = 'badge';
    } else {
      $('#sAvgSub').textContent = s.grams > 0 ? '等待金价' : '还没有持仓';
      $('#avgHint').textContent = '';
      $('#avgHint').className = 'badge';
    }

    $('#sGrams').textContent = gfmt(s.grams) + ' g';
    $('#sGramsSub').textContent = s.buyG > 0 ? '累计买入 ' + gfmt(s.buyG) + ' g' : '—';

    $('#sCost').textContent = money(s.cost);
    $('#sCostSub').textContent = '累计投入 ' + money(s.buyAmt);

    $('#sValue').textContent = hasSpot ? money(s.value) : '—';
    $('#sValueSub').textContent = hasSpot ? '@ ' + money(s.spot) + '/g' : '需要金价';

    var u = $('#sUnreal');
    u.textContent = hasSpot && s.grams > 0 ? signed(s.unreal) : '—';
    u.className = 'v ' + (s.unreal > 0.005 ? 'up' : s.unreal < -0.005 ? 'dn' : 'flat');
    $('#sUnrealSub').innerHTML = hasSpot && s.grams > 0
      ? '<span class="' + (s.unreal > 0.005 ? 'up' : s.unreal < -0.005 ? 'dn' : 'flat') + '">' + pct(s.unrealPct) + '</span>'
      : (s.grams > 0 ? '需要金价' : '—');

    var r = $('#sReal');
    r.textContent = s.sellG > 0 ? signed(s.realized) : '—';
    r.className = 'v ' + (s.realized > 0.005 ? 'up' : s.realized < -0.005 ? 'dn' : 'flat');
    $('#sRealSub').textContent = s.sellG > 0 ? '累计卖出 ' + gfmt(s.sellG) + ' g' : '还没有卖出';

    if (s.overSold) {
      $('#sRealSub').innerHTML += ' <span class="badge warn">卖出多于持有</span>';
    }
  }

  /* ---------------- 渲染：走势图 ---------------- */

  function downsample(arr, max) {
    if (arr.length <= max) return arr;
    var out = [], step = arr.length / max;
    for (var i = 0; i < max; i++) out.push(arr[Math.floor(i * step)]);
    out.push(arr[arr.length - 1]);
    return out;
  }

  /* 把 'YYYY-MM-DD' 换成当天中午的时间戳，避开时区边界 */
  function recTimestamp(dateStr) {
    var t = new Date((dateStr || '') + 'T12:00:00').getTime();
    return isFinite(t) ? t : Date.now();
  }

  /* ---- 历史日线：东方财富 · 沪金主连（元/克），2026-01-01 起，支持跨域 ---- */
  var DAILY_KEY = 'gl.daily.v1';
  var EM_URL = 'https://push2his.eastmoney.com/api/qt/stock/kline/get'
    + '?fields1=f1,f2,f3,f4&fields2=f51,f52,f53,f54,f55,f56'
    + '&klt=101&fqt=0&beg=20260101&end=20500101&secid=113.aum';

  function fetchDaily() {
    var cached = readLS(DAILY_KEY, null);
    var today = todayStr();
    if (cached && cached.date === today && Array.isArray(cached.list) && cached.list.length > 1) {
      return Promise.resolve(cached.list);
    }
    return fetchJSON(EM_URL, {}, 15000).then(function (d) {
      var kl = d && d.data && d.data.klines;
      if (!Array.isArray(kl) || !kl.length) throw new Error('历史行情为空');
      var list = [];
      kl.forEach(function (s) {
        var f = String(s).split(',');
        var c = num(f[2]);
        if (f[0] && c > 0) list.push({ d: f[0], c: c });
      });
      if (list.length < 2) throw new Error('历史行情不足');
      writeLS(DAILY_KEY, { date: today, list: list });
      return list;
    });
  }

  var dailyLoading = null;
  function ensureDaily(force) {
    if (!force && state.daily && state.daily.length) { renderChart(); return Promise.resolve(state.daily); }
    if (dailyLoading) return dailyLoading;
    dailyLoading = fetchDaily().then(function (list) {
      state.daily = list;
      state.dailyErr = '';
      dailyLoading = null;
      renderChart();
      return list;
    }).catch(function (e) {
      dailyLoading = null;
      state.dailyErr = (e && e.message) ? e.message : '失败';
      renderChart();
      return [];
    });
    return dailyLoading;
  }

  /* ---- 金价序列 = 日线 + 本地实时采样（超过去重） ---- */
  function buildPriceSeries() {
    var out = [];
    (state.daily || []).forEach(function (p) {
      if (p && p.d) out.push({ t: recTimestamp(p.d), c: num(p.c) });
    });
    var lastT = out.length ? out[out.length - 1].t : 0;
    (state.hist || []).forEach(function (p) {
      if (p && p.c > 0 && p.t > 0 && p.t > lastT + 3600e3) out.push({ t: p.t, c: p.c });
    });
    if (!out.length) {
      (state.hist || []).forEach(function (p) {
        if (p && p.c > 0 && p.t > 0) out.push({ t: p.t, c: p.c });
      });
    }
    out.sort(function (a, b) { return a.t - b.t; });
    /* 整条曲线平移，让最后一个点正好等于卡片上的价（中行积存金） */
    if (out.length && state.spot && state.spot.cny > 0) {
      var lastC = out[out.length - 1].c;
      var shift = lastC > 0 ? state.spot.cny - lastC : 0;
      if (isFinite(shift) && Math.abs(shift) < 500) {
        for (var i = 0; i < out.length; i++) out[i].c += shift;
        state.lastShift = shift;
      } else { state.lastShift = 0; }
    } else { state.lastShift = 0; }
    return out;
  }

  /* ---- 每笔交易之后的持仓均价，清仓处断开成多段 ---- */
  function buildAvgSegments() {
    var rs = state.records.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
    var g = 0, cost = 0, segs = [], cur = [];
    rs.forEach(function (r) {
      var gg = num(r.grams), p = num(r.price), fee = num(r.fee);
      if (gg <= 0) return;
      if (r.side === 'buy') { g += gg; cost += gg * p + fee; }
      else {
        var sold = Math.min(gg, g);
        var avg = g > 0 ? cost / g : 0;
        cost -= sold * avg; g -= sold;
      }
      if (g < 1e-9) { g = 0; cost = 0; }
      var t = recTimestamp(r.date);
      if (g > 0) {
        var v = cost / g;
        if (cur.length && Math.abs(cur[cur.length - 1].t - t) < 1000) {
          cur[cur.length - 1].v = v;
          cur[cur.length - 1].r = r;
        } else {
          cur.push({ t: t, v: v, r: r });
        }
      } else if (cur.length) { segs.push(cur); cur = []; }
    });
    if (cur.length) segs.push(cur);
    return segs;
  }

  /* ---- 阶梯线平滑：把每个「跳变」摊成一个 S 形过渡，平台保留 ---- */
  function stepCurve(seg, fx, fy, halfW, endX) {
    if (!seg.length) return '';
    var d = 'M' + fx(seg[0].t).toFixed(1) + ',' + fy(seg[0].v).toFixed(1);
    for (var i = 1; i < seg.length; i++) {
      var x0 = fx(seg[i - 1].t), x1 = fx(seg[i].t);
      var y0 = fy(seg[i - 1].v), y1 = fy(seg[i].v);
      var w = Math.min(halfW, Math.max(0, (x1 - x0) / 2));
      if (w < 0.5) { d += 'L' + x1.toFixed(1) + ',' + y1.toFixed(1); continue; }
      d += 'L' + (x1 - w).toFixed(1) + ',' + y0.toFixed(1);
      d += 'C' + (x1 - w / 3).toFixed(1) + ',' + y0.toFixed(1) + ' ' +
                 (x1 + w / 3).toFixed(1) + ',' + y1.toFixed(1) + ' ' +
                 (x1 + w).toFixed(1) + ',' + y1.toFixed(1);
    }
    if (endX != null) d += 'L' + endX.toFixed(1) + ',' + fy(seg[seg.length - 1].v).toFixed(1);
    return d;
  }

  /* ---- 平滑曲线：Catmull-Rom 转三次贝塞尔 ---- */
  function smoothPath(pts, top, bottom) {
    if (!pts.length) return '';
    if (pts.length < 3) {
      var s = '';
      for (var k = 0; k < pts.length; k++) s += (k ? 'L' : 'M') + pts[k].x.toFixed(1) + ',' + pts[k].y.toFixed(1);
      return s;
    }
    var T = 0.85;
    function clampY(y) { return Math.max(top, Math.min(bottom, y)); }
    var d = 'M' + pts[0].x.toFixed(1) + ',' + pts[0].y.toFixed(1);
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i];
      var p1 = pts[i];
      var p2 = pts[i + 1];
      var p3 = pts[i + 2] || p2;
      var c1x = p1.x + (p2.x - p0.x) / 6 * T;
      var c1y = clampY(p1.y + (p2.y - p0.y) / 6 * T);
      var c2x = p2.x - (p3.x - p1.x) / 6 * T;
      var c2y = clampY(p2.y - (p3.y - p1.y) / 6 * T);
      d += 'C' + c1x.toFixed(1) + ',' + c1y.toFixed(1) + ' ' +
                   c2x.toFixed(1) + ',' + c2y.toFixed(1) + ' ' +
                   p2.x.toFixed(1) + ',' + p2.y.toFixed(1);
    }
    return d;
  }

  /* ---- 悬停提示 ---- */
  var chartHover = [];
  function hideTip() {
    var t = $('#chartTip'), g = $('#chartGuide');
    if (t) t.hidden = true;
    if (g) g.hidden = true;
  }
  function showTip(ev, svg) {
    var tip = $('#chartTip'), guide = $('#chartGuide');
    var card = document.querySelector('.chart-card');
    if (!tip || !guide || !card || !chartHover.length) return;
    var sr = svg.getBoundingClientRect();
    var cr = card.getBoundingClientRect();
    if (!sr || !cr || !sr.width) return;

    var sx = (ev.clientX - sr.left) / sr.width * 680;
    var best = null, bd = 1e9;
    for (var i = 0; i < chartHover.length; i++) {
      var dd = Math.abs(chartHover[i].x - sx);
      if (dd < bd) { bd = dd; best = chartHover[i]; }
    }
    if (!best || bd > 30) { hideTip(); return; }

    var px = (best.x / 680) * sr.width + (sr.left - cr.left);
    var py = (best.y / 210) * sr.height + (sr.top - cr.top);

    guide.hidden = false;
    guide.style.left = px.toFixed(1) + 'px';
    guide.style.top = (sr.top - cr.top).toFixed(1) + 'px';
    guide.style.height = sr.height.toFixed(1) + 'px';

    var r = best.r;
    tip.innerHTML =
      '<div class="t1">' + esc(r.date) + ' · ' + (r.side === 'buy' ? '买入' : '卖出') + '</div>' +
      '<div class="t2 ' + r.side + '">' + fmt(num(r.price), 2) + ' 元/克</div>' +
      '<div class="t3">' + gfmt(num(r.grams)) + ' g · 共 ' + money(num(r.grams) * num(r.price) + (r.side === 'buy' ? num(r.fee) : 0)) + '</div>';
    tip.hidden = false;

    var tw = tip.offsetWidth || 120, th = tip.offsetHeight || 52;
    var left = Math.min(Math.max(px, tw / 2 + 4), Math.max(4, cr.width - tw / 2 - 4));
    tip.style.left = left.toFixed(1) + 'px';
    var top = py - th - 12;
    if (top < 2) top = py + 16;
    tip.style.top = top.toFixed(1) + 'px';
  }

  /* ---- 时间窗档位 ---- */
  var RANGE_STOPS = [
    { d: 5, label: '5 天' },

    { d: 30, label: '1 个月' },

    { d: 90, label: '3 个月' },
    { d: 120, label: '4 个月' },

    { d: 100000, label: '全部' }
  ];
  function rangePrefix() {
    var i = state.settings.rangeIdx | 0;
    if (i < 0 || i >= RANGE_STOPS.length) i = 5;
    return RANGE_STOPS[i];
  }
  function syncRangeUI() {

  function renderChart() {
    var el = $('#chart');
    if (!el) return;

    var all = buildPriceSeries();
    var segsAll = buildAvgSegments();
    var avgAll = [];
    segsAll.forEach(function (s) { s.forEach(function (p) { avgAll.push(p); }); });

    $('#chartHint').textContent = all.length ? ('沪金 · ' + all.length + ' 个点') : '';

    if (!all.length && !avgAll.length) {
      el.innerHTML = '<div class="empty">' + (state.dailyErr
        ? '历史金价获取失败：' + esc(state.dailyErr) + '<br>点右上角「刷新」再试'
        : '正在获取历史金价…') + '</div>';
      return;
    }

    /* ---- 时间窗 ---- */
    var tsAll = [];
    all.forEach(function (p) { tsAll.push(p.t); });
    avgAll.forEach(function (p) { tsAll.push(p.t); });
    var tEnd = tsAll.length ? Math.max.apply(null, tsAll) : Date.now();
    var tMin = tsAll.length ? Math.min.apply(null, tsAll) : tEnd;
    var stop = rangePrefix();
    var t0 = Math.max(tMin, tEnd - stop.d * 86400000);
    var t1 = tEnd;
    if (t1 - t0 < 86400000) t0 = t1 - 86400000;

    var price = all.filter(function (p) { return p.t >= t0 && p.t <= t1; });
    price = downsample(price, 400);

    var openPos = stats && stats.grams > 0;
    function clipSeg(seg, isOpen) {
      if (!seg || !seg.length) return [];
      var lastP = seg[seg.length - 1];
      if (lastP.t < t0) return isOpen ? [{ t: t0, v: lastP.v }] : [];
      var out = [], i, active = null;
      for (i = 0; i < seg.length; i++) { if (seg[i].t <= t0) active = seg[i]; else break; }
      if (active) out.push({ t: t0, v: active.v, r: active.r });
      for (i = 0; i < seg.length; i++) if (seg[i].t > t0 && seg[i].t <= t1) out.push(seg[i]);
      return out;
    }
    var segs = [];
    segsAll.forEach(function (s, si) {
      var c = clipSeg(s, si === segsAll.length - 1 && openPos);
      if (c.length) segs.push(c);
    });

    /* ---- 值域 ---- */
    var vals = [];
    price.forEach(function (p) { vals.push(p.c); });
    segs.forEach(function (s) { s.forEach(function (p) { vals.push(p.v); }); });
    if (!vals.length) { el.innerHTML = '<div class="empty">这个区间还没有数据</div>'; return; }

    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var realLo = lo, realHi = hi;
    var span = hi - lo;
    if (span < 0.5) span = Math.max(hi * 0.008, 1);
    lo -= span * 0.12; hi += span * 0.12;

    var W = 680, H = 210, PL = 10, PR = 10, PT = 14, PB = 10;
    var iw = W - PL - PR, ih = H - PT - PB;
    function X(t) { return PL + iw * (t - t0) / (t1 - t0); }
    function Y(v) { return PT + ih - ih * (v - lo) / (hi - lo); }

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">';
    svg += '<defs>' +
      '<linearGradient id="gFill" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#C2703D" stop-opacity=".18"/>' +
        '<stop offset="100%" stop-color="#E0A15E" stop-opacity="0"/>' +
      '</linearGradient>' +
      '<linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0">' +
        '<stop offset="0%" stop-color="#C2703D"/>' +
        '<stop offset="100%" stop-color="#D98B2B"/>' +
      '</linearGradient>' +
    '</defs>';

    for (var k = 0; k < 4; k++) {
      var gy = PT + ih * k / 3;
      svg += '<line x1="' + PL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + gy.toFixed(1) +
             '" stroke="#F4EAE0" stroke-width="1"' + (k === 3 ? '' : ' stroke-dasharray="3 5"') + '/>';
    }

    /* ---- 金价：细线 + 平滑 ---- */
    var pxy = price.map(function (p) { return { x: X(p.t), y: Y(p.c) }; });
    if (pxy.length >= 2) {
      var dp = smoothPath(pxy, PT, PT + ih);
      var xa = pxy[0].x.toFixed(1), xb = pxy[pxy.length - 1].x.toFixed(1);
      svg += '<path d="' + dp + 'L' + xb + ',' + (PT + ih) + 'L' + xa + ',' + (PT + ih) + 'Z" fill="url(#gFill)"/>';
      svg += '<path d="' + dp + '" fill="none" stroke="url(#gLine)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
    }
    if (pxy.length >= 1) {
      var lastPx = pxy[pxy.length - 1];
      svg += '<circle cx="' + lastPx.x.toFixed(1) + '" cy="' + lastPx.y.toFixed(1) + '" r="3.2" fill="#C2703D" stroke="#fff" stroke-width="1.6"/>';
    }

    /* ---- 持仓均价：紫罗兰细线 + 台阶 ---- */
    chartHover = [];
    segs.forEach(function (seg, si) {
      var endX = (si === segs.length - 1 && openPos) ? (W - PR) : null;
      var path = stepCurve(seg, X, Y, 10, endX);
      svg += '<path d="' + path + '" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" opacity=".9" vector-effect="non-scaling-stroke"/>';
      svg += '<path d="' + path + '" fill="none" stroke="#6A4C93" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
      seg.forEach(function (p) {
        if (!p.r) return;
        var cx = X(p.t), cy = Y(p.v);
        svg += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="3" fill="#6A4C93" stroke="#fff" stroke-width="1.6"/>';
        chartHover.push({ x: cx, y: cy, r: p.r });
      });
    });
    svg += '</svg>';

    var fd = function (t) {
      var dd = new Date(t);
      return (dd.getMonth() + 1) + '/' + dd.getDate();
    };
    var out = svg + '<div class="axis"><span>' + fd(t0) + '</span><span>高 ' + realHi.toFixed(1) + ' · 低 ' + realLo.toFixed(1) + '</span><span>' + fd(t1) + '</span></div>';

    var lg = '<div class="legend">';
    if (price.length) {
      lg += '<span><i style="background:linear-gradient(90deg,#C2703D,#D98B2B)"></i>金价 <b>' + fmt(price[price.length - 1].c, 2) + '</b></span>';
    }
    if (segs.length) {
      var lastSeg = segs[segs.length - 1];
      lg += '<span><i style="background:#6A4C93"></i>持仓均价 <b>' + fmt(lastSeg[lastSeg.length - 1].v, 2) + '</b></span>';
    }
    lg += '</div>';
    el.innerHTML = out + lg;
    if (Math.abs(num(state.lastShift)) >= 0.5) {
      el.innerHTML += '<div class="chart-note">金价曲线已整体平移到你的报价水平（沪金主连 ' +
        (state.lastShift > 0 ? '+' : '') + fmt(state.lastShift, 2) + ' 元/克），这样两条线才能直接比盈亏</div>';
    }

    /* ---- 绑定悬停 ---- */
    var svgEl = el.querySelector('svg');
    if (svgEl && svgEl.addEventListener) {
      svgEl.addEventListener('pointermove', function (ev) { showTip(ev, svgEl); });
      svgEl.addEventListener('pointerleave', hideTip);
      svgEl.addEventListener('pointercancel', hideTip);
    }
    if (typeof hideTip === 'function') hideTip();
  }

  /* ---------------- 渲染：记录 ---------------- */
  function renderRecords() {
    var list = $('#recList'), empty = $('#recEmpty');
    var rs = state.records.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    $('#recCount').textContent = rs.length + ' 笔';
    if (!rs.length) { empty.hidden = false; list.innerHTML = ''; return; }
    empty.hidden = true;

    var h = '';
    rs.forEach(function (r) {
      var g = num(r.grams), p = num(r.price), fee = num(r.fee);
      var amt = g * p + (r.side === 'buy' ? fee : -fee);
      h += '<div class="rec ' + r.side + '" data-id="' + r.id + '">' +
        '<div class="tag">' + (r.side === 'buy' ? '买入' : '卖出') + '</div>' +
        '<div class="main">' +
          '<div class="l1"><span>' + gfmt(g) + ' g × ' + fmt(p, 2) + '</span>' +
          '<span class="amt">' + (r.side === 'buy' ? '-' : '+') + money(amt) + '</span></div>' +
          '<div class="l2"><span>' + r.date + '</span>' +
          (fee > 0 ? '<span>手续费 ' + fmt(fee, 2) + '</span>' : '') +
          (r.note ? '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.note) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="ops">' +
          '<button data-act="edit" title="编辑">✎</button>' +
          '<button data-act="del" title="删除">🗑</button>' +
        '</div>' +
      '</div>';
    });
    list.innerHTML = h;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderAll() {
    computeStats();
    renderPrice();
    renderSyncState();
    renderStats();
    renderChart();
    renderRecords();
  }

  /* ---------------- 持久化 ---------------- */
  function saveData(touch) {
    writeLS(K.rec, state.records);
    writeLS(K.set, state.settings);
    writeLS(K.hist, state.hist);
    if (touch !== false) {
      state.meta.updatedAt = Date.now();
      writeLS(K.meta, state.meta);
      scheduleSync();
    }
  }
  function saveSync() { writeLS(K.sync, state.sync); }

  /* ---------------- 金价 ---------------- */
  function setSpot(obj) {
    state.spot = Object.assign({ ts: Date.now() }, obj);
    state.err = '';
    writeLS(K.spot, state.spot);
    pushHistory(state.spot.cny);
  }

  function pushHistory(c) {
    if (!(c > 0)) return;
    var h = state.hist, now = Date.now(), last = h[h.length - 1];
    if (last && now - last.t < SAMPLE_GAP) { last.c = c; }
    else { h.push({ t: now, c: c }); }
    if (h.length > 4000) h.splice(0, h.length - 4000);
    writeLS(K.hist, h);
  }

  function fetchAuto() {
    var prem = num(state.settings.premium);
    var manualFx = num(state.settings.usdCny);
    return Promise.all([
      fetchJSON('https://api.gold-api.com/price/XAU'),
      manualFx > 0 ? Promise.resolve(null)
        : fetchJSON('https://open.er-api.com/v6/latest/USD').catch(function () { return null; })
    ]).then(function (res) {
      var g = res[0], fx = res[1];
      var usdPerOz = num(g && g.price);
      if (!(usdPerOz > 0)) throw new Error('返回数据异常');
      var rate = manualFx > 0 ? manualFx : num(fx && fx.rates && fx.rates.CNY);
      if (!(rate > 0)) rate = 7.1;
      var cny = usdPerOz / OZ * rate + prem;
      return { cny: cny, usdPerOz: usdPerOz, usdCny: rate, src: '国际金价折算' };
    }, function () {
      throw new Error('网络不通（可改用代理或手动）');
    });
  }

  /* 银行金条牌价：免费聚合接口，支持跨域，无需 key */
  var BANK_API = 'https://v2.xxapi.cn/api/goldprice';
  function fetchBank() {
    return fetchJSON(BANK_API).then(function (d) {
      var list = d && d.data && d.data.bank_gold_bar_price;
      if (!Array.isArray(list) || !list.length) throw new Error('银行报价为空');
      var want = state.settings.bank || '中国银行';
      var kws = BANK_ALIAS[want] || [want];
      var hit = null;
      for (var i = 0; i < list.length && !hit; i++) {
        var nm = String(list[i].bank || '');
        for (var k = 0; k < kws.length; k++) {
          if (nm.indexOf(kws[k]) >= 0) { hit = list[i]; break; }
        }
      }
      if (!hit) hit = list[0];
      var p = num(hit.price);
      if (!(p > 0)) throw new Error('价格异常');
      return { cny: p, usdPerOz: 0, usdCny: 0, src: String(hit.bank) };
    });
  }

  function fetchProxy() {
    var url = (state.settings.proxy || '').trim();
    if (!url) return Promise.reject(new Error('未填代理地址'));
    return fetchJSON(url).then(function (d) {
      var cny = num(d && (d.cny != null ? d.cny : (d.price != null ? d.price : d.priceCnyPerGram)));
      if (!(cny > 0)) throw new Error('返回格式不对');
      return {
        cny: cny,
        usdPerOz: num(d.usdPerOz),
        usdCny: num(d.usdCny),
        src: d.source ? ('代理 · ' + d.source) : '自定义代理'
      };
    });
  }

  function refreshPrice(silent) {
    var s = state.settings;
    if (s.source === 'manual') {
      var p = num(s.manual);
      if (p > 0) { setSpot({ cny: p, usdPerOz: 0, usdCny: 0, src: '手动填写' }); renderAll(); return Promise.resolve(); }
      state.err = '请先在设置里填写金价';
      renderPrice();
      return Promise.resolve();
    }
    if (state.busy) return Promise.resolve();
    state.busy = true; state.err = '';
    renderPrice();

    var task;
    if (s.source === 'proxy') task = fetchProxy();
    else if (s.source === 'bank') {
      task = fetchBank().catch(function () {
        return fetchAuto().then(function (r) { r.src = r.src + ' · 银行源暂不可用'; return r; });
      });
    } else task = fetchAuto();
    return task.then(function (r) {
      state.busy = false;
      var off = num(s.offset);
      var src = r.src + (Math.abs(off) > 0.004 ? ' · 已校准' : '');
      setSpot({ cny: r.cny + off, usdPerOz: r.usdPerOz || 0, usdCny: r.usdCny || 0, src: src });
      renderAll();
    }).catch(function (e) {
      state.busy = false;
      state.err = e && e.name === 'AbortError' ? '超时' : (e && e.message ? e.message : '失败');
      renderPrice();
      if (!silent) toast('金价获取失败：' + state.err);
    });
  }

  /* 用中行 App 上的价格校准偏移量 */
  function calibrate() {
    var cur = state.spot && state.spot.cny > 0 ? state.spot.cny : 0;
    var v = prompt('输入中国银行 App 上「积存金」现在的价格（元/克）：',
                   cur > 0 ? fmt(cur, 2).replace(/,/g, '') : '');
    if (v === null) return;
    var n = num(v);
    if (!(n > 0)) { toast('请输入一个数字'); return; }
    if (!(cur > 0)) { toast('等金价加载出来再校准'); return; }
    var raw = cur - num(state.settings.offset);
    state.settings.offset = Math.round((n - raw) * 100) / 100;
    writeLS(K.set, state.settings);
    saveData(false);
    refreshPrice(true);
    toast('已对齐到 ' + fmt(n, 2) + ' 元/克（偏移 ' + signed(state.settings.offset, 2) + '）');
  }

    lastField = '';
    setSide(rec ? rec.side : 'buy');
    openModal('modalRec');
    if (!rec) setTimeout(function () { $('#rGrams').focus(); }, 220);
  }

  function setSide(side) {
    $$('#modalRec .seg-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.side === side);
    });
    $('#modalRec').dataset.side = side;
  }
  function getSide() { return $('#modalRec').dataset.side || 'buy'; }

  function syncFields(from) {
    var g = num($('#rGrams').value), p = num($('#rPrice').value), a = num($('#rAmount').value);
    if (from === 'grams') {
      if (p > 0) $('#rAmount').value = trimNum(g * p);
      else if (a > 0 && g > 0) $('#rPrice').value = trimNum(a / g);
    } else if (from === 'price') {
      if (g > 0) $('#rAmount').value = trimNum(g * p);
      else if (a > 0 && p > 0) $('#rGrams').value = trimNum(a / p);
    } else if (from === 'amount') {
      if (g > 0) $('#rPrice').value = trimNum(a / g);
      else if (p > 0) $('#rGrams').value = trimNum(a / p);
    }
  }
  function trimNum(n) {
    if (!isFinite(n)) return '';
    return String(Math.round(n * 10000) / 10000);
  }

  function submitRec(e) {
    e.preventDefault();
    var g = num($('#rGrams').value), p = num($('#rPrice').value), a = num($('#rAmount').value);
    if (!(g > 0) && a > 0 && p > 0) { g = a / p; }
    if (!(p > 0) && a > 0 && g > 0) { p = a / g; }
    if (!(g > 0)) { toast('请填写克重'); return; }
    if (!(p > 0)) { toast('请填写单价或总金额'); return; }

    var rec = {
      id: editingId || uid(),
      date: $('#rDate').value || todayStr(),
      side: getSide(),
      grams: Math.round(g * 1000) / 1000,
      price: Math.round(p * 10000) / 10000,
      fee: Math.round(num($('#rFee').value) * 100) / 100,
      note: $('#rNote').value.trim(),
      createdAt: Date.now()
    };

    if (editingId) {
      var i = state.records.findIndex(function (r) { return r.id === editingId; });
      if (i >= 0) { rec.createdAt = state.records[i].createdAt || Date.now(); state.records[i] = rec; }
    } else {
      state.records.push(rec);
    }
    saveData();
    renderAll();
    closeModal('modalRec');
    toast(editingId ? '已更新' : '已记录 ' + gfmt(rec.grams) + ' g');
    editingId = null;
  }

  /* ---------------- 弹窗 ---------------- */
  function openModal(id) { $('#' + id).hidden = false; document.body.style.overflow = 'hidden'; }
  function closeModal(id) { $('#' + id).hidden = true; document.body.style.overflow = ''; }

  /* ---------------- 设置 ---------------- */
  function openSettings() {
    var s = state.settings;
    $('#sSource').value = s.source;
    $('#sBank').value = s.bank || '中国银行';
    $('#sOffset').value = s.offset ? trimNum(s.offset) : '';
    $('#sManual').value = s.manual ? trimNum(s.manual) : '';
    $('#sProxy').value = s.proxy || '';
    $('#sPremium').value = s.premium ? trimNum(s.premium) : '';
    $('#sUsdCny').value = s.usdCny ? trimNum(s.usdCny) : '';
    $('#sToken').value = state.sync.token || '';
    $('#sGist').value = state.sync.gistId || '';
    $('#sAutoSync').checked = !!state.sync.auto;
    renderSyncState();
    toggleSourceBoxes();
    openModal('modalSet');
  }
  function toggleSourceBoxes() {
    var v = $('#sSource').value;
    $('#boxBank').hidden = v !== 'bank';
    $('#boxOffset').hidden = v === 'manual';
    $('#boxManual').hidden = v !== 'manual';
    $('#boxProxy').hidden = v !== 'proxy';
    $('#boxAuto').hidden = v !== 'auto';
    $('#srcHint').textContent =
      v === 'bank' ? '直接取银行公布的金条牌价，和你在中行买入的价格最接近；每个交易日更新一次。' :
      v === 'auto' ? '国际金价折算，实时更新。但国内银行价通常比它高 15~30 元/克。' :
      v === 'proxy' ? '自己部署的代理，可接上金所 Au99.99 或自有接口。' :
      '完全手动，金价自己填。';
  }
  function saveSettings() {
    state.settings = {
      source: $('#sSource').value,
      bank: $('#sBank').value,
      offset: num($('#sOffset').value),
      manual: num($('#sManual').value),
      proxy: $('#sProxy').value.trim(),
      premium: num($('#sPremium').value),
      usdCny: num($('#sUsdCny').value)
    };
    state.sync.token = $('#sToken').value.trim();
    state.sync.gistId = $('#sGist').value.trim();
    state.sync.auto = $('#sAutoSync').checked;
    saveSync(); saveData(false);
    closeModal('modalSet');
    toast('设置已保存');
    refreshPrice(true);
  }

  /* ---------------- 云同步（GitHub Gist） ---------------- */
  var syncTimer = null, syncing = false;
  function scheduleSync() {
    if (!state.sync.token || !state.sync.gistId || !state.sync.auto) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { doSync(true); }, 2500);
  }

  function gh(path, opts) {
    opts = opts || {};
    var headers = {
      'Accept': 'application/vnd.github+json',
      'Authorization': 'Bearer ' + state.sync.token,
      'X-GitHub-Api-Version': '2022-11-28'
    };
    if (opts.body) headers['Content-Type'] = 'application/json';
    return fetch('https://api.github.com' + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body
    }).then(function (r) {
      if (r.status === 204 || r.status === 304) return null;
      return r.json().then(function (d) {
        if (!r.ok) throw new Error((d && d.message) || ('HTTP ' + r.status));
        return d;
      });
    });
  }

  function docPayload() {
    return {
      app: 'gold-ledger',
      version: 1,
      updatedAt: state.meta.updatedAt || Date.now(),
      records: state.records,
      settings: state.settings,
      hist: state.hist.slice(-2000)
    };
  }

  function applyRemote(doc) {
    if (!doc || !Array.isArray(doc.records)) throw new Error('云端数据格式不对');
    state.records = doc.records;
    state.hist = Array.isArray(doc.hist) ? doc.hist : [];
    state.meta.updatedAt = doc.updatedAt || Date.now();
    if (doc.settings) {
      state.settings = Object.assign({}, DEFAULT_SET, doc.settings);
      writeLS(K.set, state.settings);
    }
    writeLS(K.rec, state.records);
    writeLS(K.hist, state.hist);
    writeLS(K.meta, state.meta);
    renderAll();
  }

  function readGistFile(g) {
    var f = g && g.files && g.files[GIST_FILE];
    if (!f) return Promise.reject(new Error('云端还没有数据文件'));
    if (f.truncated && f.raw_url) {
      return fetch(f.raw_url).then(function (r) { return r.text(); }).then(JSON.parse);
    }
    return Promise.resolve(JSON.parse(f.content));
  }

  function doSync(auto) {
    if (syncing) return Promise.resolve();
    if (!state.sync.token) { if (!auto) toast('请先填 GitHub Token'); return Promise.resolve(); }
    if (!state.sync.gistId) { if (!auto) toast('还没有云存档，点「新建云存档」'); return Promise.resolve(); }

    syncing = true;
    $('#btnSync').classList.add('on');
    return gh('/gists/' + state.sync.gistId)
      .then(readGistFile)
      .then(function (remote) {
        var rAt = remote.updatedAt || 0;
        var lAt = state.meta.updatedAt || 0;
        if (lAt > rAt + 1000) {
          return pushGist().then(function () { return 'pushed'; });
        }
        if (rAt > lAt + 1000) {
          applyRemote(remote);
          return 'pulled';
        }
        return 'same';
      })
      .then(function (what) {
        syncing = false;
        state.sync.lastAt = Date.now();
        state.sync.lastErr = '';
        saveSync();
        renderSyncState();
        if (!auto) {
          toast(what === 'pulled' ? '已拉取云端数据' :
                what === 'pushed' ? '已上传本机数据' : '已是最新');
        }
      })
      .catch(function (e) {
        syncing = false;
        state.sync.lastErr = friendlyErr(e && e.message);
        saveSync();
        renderSyncState();
        toast('同步失败：' + state.sync.lastErr);
      });
  }

  function pushGist() {
    var body = JSON.stringify({
      files: (function () {
        var o = {};
        o[GIST_FILE] = { content: JSON.stringify(docPayload(), null, 2) };
        return o;
      })()
    });
    return gh('/gists/' + state.sync.gistId, { method: 'PATCH', body: body });
  }

  function friendlyErr(msg) {
    var m = String(msg || '');
    if (/401|Bad credentials/i.test(m)) return '令牌无效或没复制完整 —— 去 GitHub 重新生成';
    if (/403|not accessible/i.test(m)) return '令牌没有 gist 权限 —— 重新生成时只勾 gist';
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return '连不上 GitHub API —— 网络被拦或超时';
    if (/404|Not Found/i.test(m)) return 'Gist 不存在 —— 可能已被删除，重新「新建云存档」';
    if (/409|already exists/i.test(m)) return '这个 Gist 已存在，直接点「立即同步」';
    return m;
  }

  function createGist() {
    // 直接读输入框，避免用户没点「保存设置」时令牌还没进 state
    state.sync.token = ($('#sToken').value || '').trim();
    if (!state.sync.token) { toast('请先填 GitHub Token'); return; }
    state.sync.lastErr = '';
    renderSyncState();
    $('#btnGistCreate').textContent = '创建中…';
    var body = JSON.stringify({
      description: '黄金账本 gold-ledger 数据（建议设为 secret gist）',
      public: false,
      files: (function () {
        var o = {};
        o[GIST_FILE] = { content: JSON.stringify(docPayload(), null, 2) };
        return o;
      })()
    });
    gh('/gists', { method: 'POST', body: body })
      .then(function (r) {
        state.sync.gistId = r.id;
        saveSync();
        $('#sGist').value = r.id;
        renderSyncState();
        return pushGist().then(
          function () { toast('云存档已创建，本机数据已上传'); },
          function () { toast('云存档已创建（上传失败，稍后点「立即同步」）'); }
        );
      })
      .catch(function (e) {
        var msg = friendlyErr(e && e.message);
        state.sync.lastErr = msg;
        saveSync();
        renderSyncState();
        toast('创建失败：' + msg);
      })
      .then(function () { $('#btnGistCreate').textContent = '新建云存档'; });
  }

  /* ---------------- 导入导出 ---------------- */
  function download(name, text, type) {
    var blob = new Blob([text], { type: type || 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 400);
  }
  function stamp() {
    var d = new Date(), p = function (x) { return x < 10 ? '0' + x : '' + x; };
    return '' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }
  function exportJSON() {
    download('黄金账本-' + stamp() + '.json', JSON.stringify(docPayload(), null, 2));
    toast('已导出备份');
  }
  function exportCSV() {
    var rows = [['日期', '方向', '克重(g)', '单价(元/g)', '金额(元)', '手续费(元)', '备注']];
    state.records.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (r) {
      var g = num(r.grams), p = num(r.price), f = num(r.fee);
      rows.push([r.date, r.side === 'buy' ? '买入' : '卖出', g, p, (g * p).toFixed(2), f.toFixed(2), r.note || '']);
    });
    var csv = '\uFEFF' + rows.map(function (row) {
      return row.map(function (c) {
        c = String(c);
        return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
      }).join(',');
    }).join('\r\n');
    download('黄金账本-' + stamp() + '.csv', csv, 'text/csv;charset=utf-8');
    toast('已导出 CSV');
  }
  function importJSON(file) {
    var fr = new FileReader();
    fr.onload = function () {
      var doc;
      try { doc = JSON.parse(String(fr.result)); }
      catch (e) { toast('文件解析失败'); return; }
      if (!doc || !Array.isArray(doc.records)) { toast('不是有效的备份文件'); return; }
      if (!confirm('导入将覆盖当前 ' + state.records.length + ' 条记录，确定？')) return;
      applyRemote(doc);
      state.meta.updatedAt = Date.now();
      writeLS(K.meta, state.meta);
      saveData();
      toast('已导入 ' + doc.records.length + ' 条记录');
    };
    fr.readAsText(file);
  }

  /* ---------------- 事件绑定 ---------------- */
  function bind() {
    $('#fab').addEventListener('click', function () { openRec(null); });
    $$('[data-close]').forEach(function (b) {
      b.addEventListener('click', function () { closeModal(b.dataset.close); });
    });
    $$('.modal').forEach(function (m) {
      m.addEventListener('click', function (e) { if (e.target === m) closeModal(m.id); });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') $$('.modal').forEach(function (m) { if (!m.hidden) closeModal(m.id); });
    });

    $('#formRec').addEventListener('submit', submitRec);
    $$('#modalRec .seg-btn').forEach(function (b) {
      b.addEventListener('click', function () { setSide(b.dataset.side); });
    });
    $('#rGrams').addEventListener('input', function () { lastField = 'grams'; syncFields('grams'); });
    $('#rPrice').addEventListener('input', function () { lastField = 'price'; syncFields('price'); });
    $('#rAmount').addEventListener('input', function () { lastField = 'amount'; syncFields('amount'); });

    $('#recList').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-act]');
      if (!btn) return;
      var row = btn.closest('.rec');
      var id = row && row.dataset.id;
      var rec = state.records.find(function (r) { return r.id === id; });
      if (!rec) return;
      if (btn.dataset.act === 'edit') { openRec(rec); return; }
      if (btn.dataset.act === 'del') {
        if (!confirm('删除 ' + rec.date + ' 的 ' + (rec.side === 'buy' ? '买入' : '卖出') + '记录？')) return;
        state.records = state.records.filter(function (r) { return r.id !== id; });
        saveData(); renderAll(); toast('已删除');
      }
    });

    $('#btnRefresh').addEventListener('click', function () { refreshPrice(false); ensureDaily(true); });
    $('#btnReload').addEventListener('click', function () { location.reload(); });
    $('#btnCalib').addEventListener('click', calibrate);
    $('#rangeSlider').addEventListener('input', function () {
      var i = parseInt($('#rangeSlider').value, 10);
      if (!isFinite(i)) i = 5;
      state.settings.rangeIdx = i;
      writeLS(K.set, state.settings);
      syncRangeUI();
      renderChart();
    });
    $('#btnSettings').addEventListener('click', openSettings);
    $('#btnSync').addEventListener('click', function () {
      if (!state.sync.token || !state.sync.gistId) { openSettings(); toast('先配置云同步'); return; }
      doSync(false);
    });
    $('#sSource').addEventListener('change', toggleSourceBoxes);
    $('#btnSaveSet').addEventListener('click', saveSettings);
    $('#btnGistCreate').addEventListener('click', createGist);
    $('#btnGistSync').addEventListener('click', function () {
      state.sync.token = $('#sToken').value.trim();
      state.sync.gistId = $('#sGist').value.trim();
      saveSync();
      doSync(false);
    });
    /* 换设备：复制 / 粘贴同步配置 */
    $('#btnCopyCfg').addEventListener('click', function () {
      var t = ($('#sToken').value || '').trim();
      var g = ($('#sGist').value || '').trim();
      if (!t || !g) { toast('先把 Token 和 Gist ID 都填好'); return; }
      var str = t + '|' + g;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(str).then(function () {
          toast('已复制，发到手机上粘贴即可');
        }, function () {
          window.prompt('手动复制这段：', str);
        });
      } else {
        window.prompt('手动复制这段：', str);
      }
    });
    $('#sSyncPaste').addEventListener('input', function () {
      var v = ($('#sSyncPaste').value || '').trim();
      if (v.indexOf('|') < 0) return;
      var parts = v.split('|');
      var t = (parts[0] || '').trim();
      var g = (parts[1] || '').trim();
      if (!/^(ghp_|github_pat_)/.test(t) || !g) { toast('格式不对，应该像 ghp_xxx|GistID'); return; }
      $('#sToken').value = t;
      $('#sGist').value = g;
      $('#sSyncPaste').value = '';
      state.sync.token = t;
      state.sync.gistId = g;
      state.sync.lastErr = '';
      saveSync();
      renderSyncState();
      toast('已填入，点「保存设置」再点「立即同步」');
    });

    $('#btnExport').addEventListener('click', exportJSON);    $('#btnCsv').addEventListener('click', exportCSV);
    $('#btnImport').addEventListener('click', function () { $('#fileImport').click(); });
    $('#fileImport').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (f) importJSON(f);
      e.target.value = '';
    });
    $('#btnClear').addEventListener('click', function () {
      if (!confirm('确定清空全部 ' + state.records.length + ' 条记录？建议先导出备份。')) return;
      if (!confirm('再确认一次：清空后无法恢复。')) return;
      state.records = [];
      state.hist = [];
      saveData(); renderAll(); toast('已清空');
    });

    // 回到前台时刷新
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && state.spot && Date.now() - state.spot.ts > 5 * 60000) refreshPrice(true);
    });
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    bind();
    syncRangeUI();
    renderAll();
    refreshPrice(true);
    ensureDaily();
    if (state.sync.token && state.sync.gistId) doSync(true);
    setInterval(function () { if (!document.hidden) refreshPrice(true); }, 5 * 60 * 1000);

    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  }

  /* 调试钩子：浏览器控制台里 __GL__ 可以查看/重算数据 */
  try {
    window.__GL__ = {
      state: state,
      compute: computeStats,
      stats: function () { return computeStats(); },
      render: renderAll,
      calibrate: calibrate,
      refreshPrice: refreshPrice,
      avgSegments: buildAvgSegments,
      applyRemote: applyRemote,
      docPayload: docPayload
    };
  } catch (e) {}

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
